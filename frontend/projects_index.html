<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Nutmeg · Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nutBlack: "#0b0f1a",
            nutDeep: "#121a3a",
            nutBlue: "#1e2a78",
            nutViolet: "#6d5dfc",
            nutNeon: "#9d8cff",
            nutSoft: "#b8b0ff"
          },
          boxShadow: {
            glow: "0 0 40px rgba(109,93,252,0.35)",
            cardGlow: "0 8px 32px rgba(109,93,252,0.2)",
          }
        }
      }
    }
  </script>
  <style>
    .fade-up {
      animation: fadeUp 0.6s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-nutBlack via-nutDeep to-black text-white">

  <div class="fixed inset-0 bg-[radial-gradient(circle_at_top_left,rgba(109,93,252,0.12),transparent_50%)]"></div>
  <div class="fixed inset-0 bg-[radial-gradient(circle_at_bottom_right,rgba(30,42,120,0.15),transparent_50%)]"></div>

  <!-- Top Navigation -->
  <nav class="relative z-10 flex items-center justify-between px-8 py-6">
    <a href="workspace.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
      <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
        <span class="text-xl">←</span>
      </div>
      <span class="text-sm text-gray-400">back to workspace</span>
    </a>

    <div class="flex items-center gap-4">
      <div class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-nutSoft">
        <span id="userEmail">loading…</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="relative z-10 px-8 py-4 max-w-6xl mx-auto">

    <div class="flex items-end justify-between mb-8 fade-up delay-100">
      <div>
        <h1 class="text-4xl font-light mb-2">Projects</h1>
        <div class="flex gap-4 text-sm mt-4">
          <button onclick="filterProjects('active')" id="btn-active"
            class="text-nutNeon border-b border-nutNeon pb-1">Active</button>
          <button onclick="filterProjects('done')" id="btn-done"
            class="text-gray-400 hover:text-white pb-1">Completed</button>
        </div>
      </div>
      <button onclick="openCreateModal()"
        class="px-6 py-3 rounded-xl bg-gradient-to-r from-nutViolet to-nutBlue hover:shadow-glow hover:scale-105 transition-all text-white font-medium flex items-center gap-2">
        <span>+</span> New Project
      </button>
    </div>

    <!-- Projects Grid -->
    <div id="projectsGrid"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 fade-up delay-200">
      <!-- Loading State -->
      <div class="bg-white/5 border border-white/10 rounded-2xl h-64 animate-pulse"></div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 fade-up delay-300">
      <div class="text-6xl mb-4">🌱</div>
      <h3 class="text-xl text-white mb-2">No projects found</h3>
      <p class="text-gray-500 max-w-sm mx-auto">
        No projects in this category.
      </p>
    </div>

  </main>

  <!-- Create Project Modal -->
  <div id="createModal"
    class="fixed inset-0 z-50 hidden flex items-center justify-center bg-nutBlack/80 backdrop-blur-sm">
    <div
      class="bg-[#1a1f3c] border border-white/10 p-8 rounded-2xl w-full max-w-md shadow-2xl scale-95 opacity-0 transition-all duration-300"
      id="modalContent">
      <h2 class="text-2xl font-light text-white mb-6">New Project</h2>
      <form id="createForm" class="space-y-6">
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Project Name</label>
          <input type="text" id="projectName" required
            class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-nutViolet transition-colors"
            placeholder="e.g. Q1 Marketing">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Collaborators (Select
            Multiple)</label>
          <select id="projectCollaborators" multiple
            class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-nutViolet h-24">
            <!-- Options injected -->
          </select>
          <p class="text-[10px] text-gray-500 mt-1">Hold Ctrl/Cmd to select multiple</p>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeCreateModal()"
            class="flex-1 py-3 rounded-xl border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
            Cancel
          </button>
          <button type="submit"
            class="flex-1 py-3 rounded-xl bg-gradient-to-r from-nutViolet to-nutBlue text-white font-medium hover:shadow-glow transition-all">
            Create
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    let currentFilter = 'active';

    document.addEventListener("DOMContentLoaded", async () => {
      if (!requireAuth()) return;
      const user = getCurrentUser();
      document.getElementById("userEmail").textContent = user;

      loadProjects();
      loadCollaborators();
    });

    async function loadCollaborators() {
      try {
        const users = await apiGet("/users");
        const select = document.getElementById("projectCollaborators");
        select.innerHTML = "";
        users.forEach(u => {
          const opt = document.createElement("option");
          opt.value = u;
          opt.textContent = u;
          select.appendChild(opt);
        });
      } catch (e) { console.error(e); }
    }

    async function loadProjects() {
      const grid = document.getElementById("projectsGrid");
      const emptyState = document.getElementById("emptyState");

      grid.innerHTML = '<div class="bg-white/5 border border-white/10 rounded-2xl h-64 animate-pulse"></div>';

      try {
        // Fetch stats to check limit
        const stats = await apiGet("/user/stats");
        const createBtn = document.querySelector("button[onclick='openCreateModal()']");

        // Rule: Max 2 Active Projects
        if (stats.active_count >= 2) {
          createBtn.disabled = true;
          createBtn.style.opacity = "0.5";
          createBtn.style.cursor = "not-allowed";
          createBtn.title = "Max 2 active projects allowed. Please complete one first.";
          createBtn.innerHTML = "<span>🔒</span> Limit Reached";
        } else {
          createBtn.disabled = false;
          createBtn.style.opacity = "1";
          createBtn.style.cursor = "pointer";
          createBtn.title = "";
          createBtn.innerHTML = "<span>+</span> New Project";
        }

        // Fetch filtered by status
        const projects = await apiGet(`/projects?status=${currentFilter}`);
        renderProjects(projects);
      } catch (err) {
        console.error("Error loading projects:", err);
        grid.innerHTML = `<p class="text-red-400 col-span-full text-center">could not load projects</p>`;
      }
    }

    function renderProjects(projects) {
      const grid = document.getElementById("projectsGrid");
      const emptyState = document.getElementById("emptyState");
      grid.innerHTML = "";

      if (!projects || projects.length === 0) {
        if (emptyState) emptyState.classList.remove("hidden");
        return;
      }

      if (emptyState) emptyState.classList.add("hidden");

      projects.forEach(p => {
        const card = document.createElement("div");
        card.className = "group bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-6 hover:shadow-glow hover:-translate-y-1 transition-all cursor-pointer flex flex-col justify-between h-64 fade-up relative";

        // Allow clicking card to go to project, but prevent delete button click
        card.onclick = (e) => {
          if (e.target.closest('button')) return;
          window.location.href = `project.html?id=${p.id}`;
        };

        const initials = p.name ? p.name.substring(0, 2).toUpperCase() : "??";
        const creator = p.created_by ? p.created_by.split("@")[0] : "unknown";

        // Collaborator count (parsed from JSON str if robust, but here maybe simple)
        // For now backend returns JSON string, ideally we parse it.
        let collabCount = 0;
        try {
          const c = JSON.parse(p.collaborators || "[]");
          collabCount = c.length;
        } catch (e) { }

        card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                             <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-nutViolet/20 to-nutBlue/20 border border-white/5 flex items-center justify-center text-nutNeon font-bold mb-4 group-hover:scale-110 transition-transform">
                                ${initials}
                            </div>
                            <!-- Delete/Archive Action (Mock for now, or Phase 6 backend needed) -->
                            <button class="text-gray-600 hover:text-red-400 p-1" title="Delete Project">✕</button>
                        </div>
                       
                        <h3 class="text-xl font-semibold text-white group-hover:text-nutNeon transition-colors truncate" title="${p.name}">
                            ${p.name}
                        </h3>
                        <p class="text-xs text-gray-500 mt-2 uppercase tracking-widest">
                            Created by ${creator}
                        </p>
                    </div>
                    <div class="flex items-center justify-between mt-6 pt-6 border-t border-white/5">
                        <span class="text-xs text-gray-400 group-hover:text-white transition-colors">
                            ${collabCount > 0 ? collabCount + ' collaborators' : 'Private'}
                        </span>
                        <div class="w-2 h-2 rounded-full ${p.status === 'done' ? 'bg-gray-500' : 'bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.5)]'}"></div>
                    </div>
                `;
        grid.appendChild(card);
      });
    }

    window.filterProjects = function (status) {
      currentFilter = status;

      // Update UI
      document.getElementById("btn-active").className = status === 'active' ? "text-nutNeon border-b border-nutNeon pb-1" : "text-gray-400 hover:text-white pb-1";
      document.getElementById("btn-done").className = status === 'done' ? "text-nutNeon border-b border-nutNeon pb-1" : "text-gray-400 hover:text-white pb-1";

      loadProjects();
    };

    // -------- MODAL LOGIC --------
    const modal = document.getElementById("createModal");
    const modalContent = document.getElementById("modalContent");

    window.openCreateModal = function () {
      modal.classList.remove("hidden");
      setTimeout(() => {
        modalContent.classList.remove("scale-95", "opacity-0");
        modalContent.classList.add("scale-100", "opacity-100");
        document.getElementById("projectName").focus();
      }, 10);
    };

    window.closeCreateModal = function () {
      modalContent.classList.remove("scale-100", "opacity-100");
      modalContent.classList.add("scale-95", "opacity-0");
      setTimeout(() => {
        modal.classList.add("hidden");
        document.getElementById("createForm").reset();
      }, 300);
    };

    if (modal) {
      modal.addEventListener("click", (e) => {
        if (e.target === modal) window.closeCreateModal();
      });
    }

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("projectName").value.trim();
      const select = document.getElementById("projectCollaborators");
      const collaborators = Array.from(select.selectedOptions).map(opt => opt.value);

      if (!name) return;

      try {
        await apiPost("/projects", { name, collaborators });
        window.closeCreateModal();
        loadProjects();
      } catch (err) {
        console.error("Failed to create", err);
        alert("Creation failed");
      }
    });
  </script>
</body>

</html>
