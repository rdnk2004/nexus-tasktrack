<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Nutmeg · Enter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nutmeg - Syncing calm with momentum. A premium task management workspace.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="flex items-center justify-center min-h-screen px-6">

    <!-- Ambient Light & Grain -->
    <div class="ambient-light"></div>

    <!-- Login Card -->
    <div class="card p-8 md:p-10 max-w-md w-full animate-fade-up blur-load">
        <!-- Logo -->
        <h1 class="text-center mb-2" style="font-weight: 700; letter-spacing: -0.04em;">Nutmeg.</h1>

        <!-- Catchy Phrase -->
        <p id="phrase" class="text-center text-neon text-sm mb-8 transition-opacity"
            style="font-family: serif; font-style: italic; opacity: 0.8;">
            syncing calm with momentum…
        </p>

        <!-- Form -->
        <form id="loginForm" class="flex flex-col gap-4">
            <div class="form-group mb-0">
                <input type="email" id="email" placeholder="email address" required class="input-field"
                    inputmode="email" />
            </div>

            <div class="form-group mb-4">
                <input type="password" id="password" placeholder="password" required class="input-field" />
            </div>

            <button type="submit" class="btn btn-primary w-full shadow-glow">
                Enter Workspace →
            </button>
        </form>

        <!-- Footer line -->
        <p class="mt-6 text-center text-xs" style="opacity: 0.4;">
            no admins · no noise · just progress
        </p>
    </div>

</body>

</html>
