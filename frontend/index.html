<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Nutmeg · Enter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="flex items-center justify-center">

    <!-- Ambient Light & Grain -->
    <div class="ambient-light"></div>

    <!-- Login Card -->
    <div class="card p-10 max-w-md w-full animate-fade-up">
        <!-- Logo -->
        <h1 class="text-center mb-2">Nutmeg</h1>

        <!-- Catchy Phrase -->
        <p id="phrase" class="text-center text-neon text-sm italic mb-8 transition-opacity">
            syncing calm with momentum…
        </p>

        <!-- Form -->
        <form id="loginForm" class="flex flex-col gap-4">
            <div class="form-group mb-0">
                <input type="email" id="email" placeholder="email" required class="input-field" />
            </div>

            <div class="form-group mb-4">
                <input type="password" id="password" placeholder="password" required class="input-field" />
            </div>

            <button type="submit" class="btn btn-primary w-full">
                Enter Workspace →
            </button>
        </form>

        <!-- Footer line -->
        <p class="mt-6 text-center text-xs" style="opacity: 0.5;">
            no admins · no noise · just progress
        </p>
    </div>

</body>

</html>
