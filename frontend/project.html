<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nutmeg · Project Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Kanban board to track your tasks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>
    <div class="ambient-light"></div>

    <nav class="container pt-6 pb-2 flex items-center justify-between z-10 relative">
        <div class="flex gap-4">
            <a href="workspace.html" class="flex items-center gap-2 opacity-60 hover:opacity-100 transition-opacity">
                <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center">
                    <span class="text-sm">🏠</span>
                </div>
                <span class="text-xs">Home</span>
            </a>
            <a href="projects_index.html"
                class="flex items-center gap-2 opacity-60 hover:opacity-100 transition-opacity">
                <span class="text-xs">← Projects</span>
            </a>
        </div>
        <div class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs text-soft">
            <span id="userEmail">loading…</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-6 relative z-10 max-w-[1400px]"> <!-- Wider container for kanban -->

        <div class="flex items-end justify-between mb-8 animate-fade-up delay-100">
            <div>
                <h1 class="text-3xl font-light mb-1" id="projectTitle">Loading...</h1>
                <p class="text-sm text-gray-400">Task Board</p>
            </div>
            <button onclick="openCreateTaskModal()" class="btn btn-primary">
                <span>+</span> New Task
            </button>
        </div>

        <!-- Kanban Board -->
        <div
            class="kanban-board overflow-x-auto pb-6 md:pb-0 snap-x snap-mandatory flex md:grid md:grid-cols-3 gap-4 md:gap-6">

            <!-- Column: To Do -->
            <div id="col-todo" ondrop="drop(event, 'todo')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)"
                class="kanban-col transition-colors min-w-[85vw] md:min-w-0 snap-center">

                <div class="kanban-header sticky top-0 bg-[#0e121e]/95 backdrop-blur z-10">
                    <h3 class="text-sm font-medium text-gray-300">To Do</h3>
                    <span class="text-xs bg-white/10 px-2 py-0.5 rounded text-gray-400" id="count-todo">0</span>
                </div>
                <div class="kanban-list" id="list-todo">
                    <!-- Tasks injected -->
                </div>
            </div>

            <!-- Column: Doing -->
            <div id="col-doing" ondrop="drop(event, 'doing')" ondragover="allowDrop(event)"
                ondragleave="leaveDrop(event)" class="kanban-col transition-colors min-w-[85vw] md:min-w-0 snap-center">

                <div class="kanban-header sticky top-0 bg-[#0e121e]/95 backdrop-blur z-10">
                    <h3 class="text-sm font-medium text-neon">In Progress</h3>
                    <span class="text-xs bg-white/10 px-2 py-0.5 rounded text-gray-400" id="count-doing">0</span>
                </div>
                <div class="kanban-list" id="list-doing">
                </div>
            </div>

            <!-- Column: Done -->
            <div id="col-done" ondrop="drop(event, 'done')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)"
                class="kanban-col transition-colors min-w-[85vw] md:min-w-0 snap-center">

                <div class="kanban-header sticky top-0 bg-[#0e121e]/95 backdrop-blur z-10">
                    <h3 class="text-sm font-medium text-success">Done</h3>
                    <span class="text-xs bg-white/10 px-2 py-0.5 rounded text-gray-400" id="count-done">0</span>
                </div>
                <div class="kanban-list" id="list-done">
                </div>
            </div>

        </div>

    </main>

    <!-- Create Task Modal -->
    <div id="createTaskModal" class="modal-overlay">
        <div id="taskModalContent" class="modal-content p-8 rounded-2xl w-full max-w-md shadow-card">
            <h2 class="text-xl font-light mb-6">Add New Task</h2>
            <form id="createTaskForm" class="flex flex-col gap-4">

                <div class="form-group">
                    <label class="input-label">Title</label>
                    <input type="text" id="taskTitle" required class="input-field" placeholder="What needs to be done?">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label class="input-label">Assigned To</label>
                        <select id="taskAssignee" class="input-field" style="padding: 0.8rem;">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Deadline</label>
                        <input type="datetime-local" id="taskDeadline" class="input-field" style="padding: 0.8rem;">
                    </div>
                </div>

                <div class="form-group animate-none"> <!-- override potential global animations -->
                    <label class="input-label">Description</label>
                    <textarea id="taskDesc" rows="3" class="input-field resize-none"
                        placeholder="Add details..."></textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeCreateTaskModal()" class="btn btn-secondary flex-1">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary flex-1">
                        Add Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentProjectId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            // Check Auth
            if (!requireAuth()) return;
            const user = getCurrentUser();
            const emailEl = document.getElementById("userEmail");
            if (emailEl) emailEl.textContent = user;

            // Load Users for Selector
            loadUsers();

            // Get Project ID
            const urlParams = new URLSearchParams(window.location.search);
            currentProjectId = urlParams.get('id');

            if (!currentProjectId) {
                alert("No project specified");
                window.location.href = "projects_index.html";
                return;
            }

            try {
                const projects = await apiGet("/projects");
                const p = projects.find(proj => proj.id == currentProjectId);
                if (p) {
                    document.getElementById("projectTitle").textContent = p.name;
                } else {
                    document.getElementById("projectTitle").textContent = "Project #" + currentProjectId;
                }
            } catch (e) {
                console.error("Failed to load project details", e);
            }

            // Load Tasks
            loadTasks(currentProjectId);

            // Modal Logic
            const modal = document.getElementById("createTaskModal");

            window.openCreateTaskModal = function () {
                modal.classList.add("open");

                const date = new Date();
                date.setDate(date.getDate() + 2);
                document.getElementById("taskDeadline").value = date.toISOString().slice(0, 16);

                setTimeout(() => {
                    document.getElementById("taskTitle").focus();
                }, 50);
            };

            window.closeCreateTaskModal = function () {
                modal.classList.remove("open");
                setTimeout(() => {
                    document.getElementById("createTaskForm").reset();
                }, 300);
            };

            modal.addEventListener("click", e => {
                if (e.target === modal) closeCreateTaskModal();
            });

            // Form Submit handler
            document.getElementById("createTaskForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const title = document.getElementById("taskTitle").value;
                const assignee = document.getElementById("taskAssignee").value;
                const deadline = document.getElementById("taskDeadline").value;
                const desc = document.getElementById("taskDesc").value;

                try {
                    await apiPost(`/projects/${currentProjectId}/tasks`, {
                        title: title,
                        description: desc,
                        assigned_to: assignee || null,
                        deadline: deadline ? new Date(deadline).toISOString() : null
                    });

                    closeCreateTaskModal();
                    loadTasks(currentProjectId);
                } catch (err) {
                    console.error("Failed to create task", err);
                    alert("Error creating task");
                }
            });
        });

        async function loadUsers() {
            try {
                const users = await apiGet("/users");
                const select = document.getElementById("taskAssignee");
                // Reset with Unassigned and All options
                select.innerHTML = '<option value="">Unassigned</option><option value="ALL">All Collaborators</option>';
                users.forEach(email => {
                    const opt = document.createElement("option");
                    opt.value = email;
                    opt.textContent = email;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Failed to load users", err);
            }
        }

        // -------- DRAG & DROP LOGIC --------

        window.allowDrop = function (ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add("drag-over");
        }

        window.leaveDrop = function (ev) {
            ev.currentTarget.classList.remove("drag-over");
        }

        window.drag = function (ev) {
            ev.dataTransfer.setData("text", ev.target.id);
            ev.target.classList.add("dragging");
        }

        window.drop = async function (ev, newStatus) {
            ev.preventDefault();
            const col = document.getElementById(`col-${newStatus}`);
            if (col) col.classList.remove("drag-over");

            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);

            if (!draggedElement) return;

            const targetList = document.getElementById(`list-${newStatus}`);
            targetList.appendChild(draggedElement);

            draggedElement.classList.remove("dragging");

            // Update status indicator dot in card
            const dot = draggedElement.querySelector(".status-dot");
            if (dot) {
                // Reset classes
                dot.className = "status-dot w-2 h-2 rounded-full " + getStatusColor(newStatus);
            }

            updateCounts();

            const taskId = data.replace("task-", "");
            try {
                await apiPut(`/tasks/${taskId}`, { status: newStatus });
            } catch (err) {
                console.error("Update failed", err);
                alert("Failed to save move. Refreshing...");
                loadTasks(currentProjectId);
            }
        }

        function updateCounts() {
            ['todo', 'doing', 'done'].forEach(status => {
                const list = document.getElementById(`list-${status}`);
                const count = list ? list.children.length : 0;
                const el = document.getElementById(`count-${status}`);
                if (el) el.textContent = count;
            });
        }

        async function loadTasks(projectId) {
            const lists = {
                todo: document.getElementById("list-todo"),
                doing: document.getElementById("list-doing"),
                done: document.getElementById("list-done")
            };

            Object.values(lists).forEach(el => el.innerHTML = "");

            try {
                const tasks = await apiGet(`/projects/${projectId}/tasks`);

                tasks.forEach(task => {
                    const status = task.status || "todo";
                    if (lists[status]) {
                        lists[status].appendChild(createTaskCard(task));
                    }
                });

                updateCounts();

            } catch (e) {
                console.error(e);
            }
        }

        function createTaskCard(task) {
            const div = document.createElement("div");
            div.id = `task-${task.id}`;
            div.className = "task-card group"; // classes defined in style.css

            div.draggable = true;
            div.addEventListener("dragstart", window.drag);
            div.addEventListener("dragend", (e) => e.target.classList.remove("dragging"));

            const creator = task.created_by ? task.created_by.split("@")[0] : 'unknown';
            const assignee = task.assigned_to ? task.assigned_to.split("@")[0] : 'Unassigned';

            // Format Deadline
            let deadlineHtml = "";
            let backlogWarning = "";
            if (task.deadline) {
                const d = new Date(task.deadline);
                const now = new Date();
                const diff = (d - now) / (1000 * 3600 * 24); // days
                const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

                let colorClass = "text-gray-500";
                if (diff < 0) {
                    colorClass = "text-error font-bold";
                    backlogWarning = `<div class="text-[10px] text-error mt-1 uppercase tracking-wide font-bold">Overdue</div>`;
                }
                else if (diff < 2) colorClass = "text-warning";

                deadlineHtml = `<span class="text-[10px] flex items-center gap-1 ${colorClass}">
                    ⏱ ${dateStr}
                </span>`;
            }

            div.innerHTML = `
                <div class="flex justify-between items-start mb-2 pointer-events-none">
                    <h4 class="font-medium text-sm text-white group-hover:text-neon transition-colors">${task.title}</h4>
                    ${deadlineHtml}
                </div>
                ${task.description ? `<p class="text-xs text-gray-400 mb-3 line-clamp-2 pointer-events-none">${task.description}</p>` : ''}
                ${backlogWarning}
                <div class="flex items-center justify-between mt-2 pointer-events-none pt-2 border-t border-white/5">
                   <div class="flex items-center gap-2 text-[10px] text-gray-500">
                        <span class="tracking-wider font-bold uppercase text-gray-400">${assignee}</span>
                        <span class="text-gray-700">|</span>
                        <span class="italic text-gray-600">by ${creator}</span>
                   </div>
                   <div class="status-dot w-2 h-2 rounded-full ${getStatusColor(task.status)}"></div>
                </div>
            `;
            return div;
        }

        function getStatusColor(status) {
            if (status === 'done') return "bg-success";
            if (status === 'doing') return "bg-nut-neon shadow-glow";
            return "bg-gray-500";
        }
    </script>
</body>

</html>
