<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - NEXUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .kanban-column {
            min-height: 500px;
        }

        .task-card {
            cursor: grab;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card.not-draggable {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .sortable-ghost {
            opacity: 0.3;
            background: #1a1a1a;
            border: 2px dashed #444;
        }

        .sortable-drag {
            opacity: 0.9;
            transform: rotate(2deg);
            z-index: 50;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-backdrop {
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }
    </style>
</head>

<body class="min-h-screen text-gray-300 selection:bg-yellow-500/30 overflow-x-hidden">



    <!-- Top Navigation Bar -->
    <nav class="bg-black/80 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-4">
                    <i data-lucide="network"
                        class="w-8 h-8 text-yellow-500 drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]"></i>
                    <span
                        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-500 tracking-tight">NEXUS</span>
                </div>
                <div class="hidden md:flex items-center gap-8">
                    <a href="dashboard.html"
                        class="text-gray-400 hover:text-white transition-colors font-medium">Dashboard</a>
                    <a href="projects.html"
                        class="text-yellow-500 font-medium border-b-2 border-yellow-500 pb-1 transition-all drop-shadow-[0_0_8px_rgba(255,215,0,0.3)]">Projects</a>
                    <a href="profile.html"
                        class="text-gray-400 hover:text-white transition-colors font-medium">Profile</a>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden sm:block text-right">
                        <p class="text-xs text-gray-500 uppercase tracking-wider">Operator</p>
                        <p id="userName" class="text-sm font-bold text-white">Loading...</p>
                    </div>
                    <button id="logoutBtn"
                        class="group bg-neutral-900 hover:bg-neutral-800 text-white px-4 py-2 rounded-xl transition-all border border-white/10 hover:border-red-500/50 flex items-center gap-2">
                        <i data-lucide="log-out"

                        <span class="hidden sm:inline text-sm font-medium">Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="md:hidden border-t border-white/10 px-4 py-3 flex gap-2 bg-black/90 backdrop-blur-md">
            <a href="dashboard.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors">Dashboard</a>
            <a href="projects.html"
                class="flex-1 text-center text-yellow-500 font-medium py-2 bg-yellow-500/10 rounded-lg border border-yellow-500/20">Projects</a>
            <a href="profile.html"

    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10">

        <!-- Page Header -->
        <div class="mb-10">

                class="inline-flex items-center gap-2 text-yellow-500 hover:text-yellow-400 font-bold mb-6 transition-all transform hover:-translate-x-1 uppercase text-xs tracking-wider">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

                    <div id="projectMeta" class="flex flex-wrap items-center gap-4 text-sm font-mono text-gray-400">

                </div>
                <button id="newTaskBtn"

            <!-- TO DO Column -->

    <!-- New Task Modal -->

        <div class="modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm" onclick="closeNewTaskModal()"></div>
        <div class="flex min-h-screen items-center justify-center p-4">

                class="modal-content bg-neutral-900 border border-white/10 rounded-3xl shadow-[0_0_50px_-20px_rgba(0,0,0,1)] w-full max-w-2xl relative z-10 overflow-hidden">

                    </div>

                                <span class="text-gray-300 group-hover:text-white">Self Assignment</span>
                            </label>
                            <label
                                class="flex items-center gap-3 cursor-pointer group hover:bg-white/5 p-2 rounded-lg transition-colors">
                                <input type="radio" name="assignmentType" value="specific"

                                <span class="text-gray-300 group-hover:text-white">Specific Operatives</span>
                            </label>

                                <input type="radio" name="priority" value="high"

                    <div>

    <!-- Task Detail Modal -->
    <div id="taskDetailModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm" onclick="closeTaskDetailModal()"></div>
        <div class="flex min-h-screen items-center justify-center p-4">
            <div
                class="modal-content bg-neutral-900 border border-white/10 rounded-3xl shadow-[0_0_60px_-10px_rgba(0,0,0,1)] w-full max-w-2xl relative z-10 overflow-hidden">
                <div class="border-b border-white/10 px-8 py-6 flex justify-between items-center bg-black/20">
                    <h3 class="text-2xl font-bold text-white tracking-tight">Directive Details</h3>
                    <button onclick="closeTaskDetailModal()"

    <script src="utils.js"></script>
    <script>
        let currentUser = null;
        let currentProject = null;
        let allTasks = [];
        let projectId = null;
        let selectedTaskId = null;

        // Auth Check
        async function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return null;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Invalid token');
                return await response.json();
            } catch (error) {
                removeToken();
                removeCurrentUser();
                window.location.href = 'login.html';
                return null;
            }
        }

        // Utility Functions
        function getFirstName(email) {
            return email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1);
        }

        function getAvatarColor(email) {
            const colors = [
                'bg-orange-600/20 text-orange-400 border-orange-500/30',
                'bg-blue-600/20 text-blue-400 border-blue-500/30',
                'bg-green-600/20 text-green-400 border-green-500/30',
                'bg-purple-600/20 text-purple-400 border-purple-500/30',
                'bg-pink-600/20 text-pink-400 border-pink-500/30',
                'bg-indigo-600/20 text-indigo-400 border-indigo-500/30'
            ];
            let hash = 0;
            for (let i = 0; i < email.length; i++) {
                hash = email.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getDaysUntil(dateString) {
            const deadline = new Date(dateString);
            const now = new Date();
            const diffMs = deadline - now;
            const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { text: `${Math.abs(diffDays)}d overdue`, color: 'text-red-400 font-bold' };
            if (diffDays === 0) return { text: 'Due today', color: 'text-red-400 font-bold' };
            if (diffDays === 1) return { text: 'Tomorrow', color: 'text-yellow-400' };
            return { text: `${diffDays}d left`, color: 'text-gray-500' };
        }

        // Fetch Project Details
        async function fetchProject() {
            try {
                const response = await fetch(`${API_BASE_URL}/projects/${projectId}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!response.ok) throw new Error('Project not found');
                currentProject = await response.json();
                renderProjectHeader();
            } catch (error) {
                console.error('Error fetching project:', error);
                showToast('Error loading project', 'error');
                setTimeout(() => window.location.href = 'projects.html', 2000);
            }
        }

        // Render Project Header
        function renderProjectHeader() {
            document.getElementById('projectName').textContent = currentProject.name;

            const typeBadge = currentProject.is_collaborative ?
                '<span class="bg-purple-900/30 text-purple-300 border border-purple-500/20 px-3 py-1 rounded-lg font-bold uppercase text-[10px] tracking-wider"> Collaborative </span>' :
                '<span class="bg-blue-900/30 text-blue-300 border border-blue-500/20 px-3 py-1 rounded-lg font-bold uppercase text-[10px] tracking-wider"> Individual </span>';

            const collaborators = currentProject.members.slice(0, 3).map(m => `
                <div class="${getAvatarColor(m.email)} w-7 h-7 rounded-lg border flex items-center justify-center font-bold text-xs -ml-2 shadow-lg">
                    ${getFirstName(m.email).charAt(0)}
                </div>
            `).join('');

            const moreCount = currentProject.members.length > 3 ?
                `<div class="w-7 h-7 rounded-lg bg-neutral-800 border border-white/10 flex items-center justify-center text-gray-500 text-xs font-bold -ml-2 shadow-lg">+${currentProject.members.length - 3}</div>` : '';

            const deadline = currentProject.end_date ?
                `<span class="text-gray-500 text-xs flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${new Date(currentProject.end_date).toLocaleDateString()}</span>` : '';

            document.getElementById('projectMeta').innerHTML = `
                ${typeBadge}
                ${currentProject.is_collaborative ? `<div class="flex items-center ml-2 pl-2 border-l border-white/10 h-4">${collaborators}${moreCount}</div>` : ''}
                <div class="w-px h-4 bg-white/10 mx-2"></div>
                ${deadline}
            `;
            lucide.createIcons();
        }

        // Fetch Tasks
        async function fetchTasks() {
            try {
                const response = await fetch(`${API_BASE_URL}/projects/${projectId}/tasks`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!response.ok) throw new Error('Failed to fetch tasks');
                allTasks = await response.json();
                renderKanbanBoard();
            } catch (error) {
                console.error('Error fetching tasks:', error);
                showToast('Error loading tasks', 'error');
            }
        }

        // Render Kanban Board
        function renderKanbanBoard() {
            const todoColumn = document.getElementById('todoColumn');
            const doingColumn = document.getElementById('doingColumn');
            const doneColumn = document.getElementById('doneColumn');

            // Clear columns
            todoColumn.innerHTML = '';
            doingColumn.innerHTML = '';
            doneColumn.innerHTML = '';

            // Group tasks by current user's status
            const myTasks = {
                todo: [],
                doing: [],
                done: []
            };

            allTasks.forEach(task => {
                const myAssignment = task.assignees.find(a => a.email === currentUser.email);
                if (myAssignment) {
                    const status = myAssignment.status;
                    if (status === 'todo') myTasks.todo.push(task);
                    else if (status === 'doing') myTasks.doing.push(task);
                    else if (status === 'done') myTasks.done.push(task);
                }
            });

            // Update counts
            document.getElementById('todoCount').textContent = myTasks.todo.length;
            document.getElementById('doingCount').textContent = myTasks.doing.length;
            document.getElementById('doneCount').textContent = myTasks.done.length;

            // Render cards
            myTasks.todo.forEach(task => todoColumn.appendChild(createTaskCard(task)));
            myTasks.doing.forEach(task => doingColumn.appendChild(createTaskCard(task)));
            myTasks.done.forEach(task => doneColumn.appendChild(createTaskCard(task)));

            // Show placeholders if empty
            if (myTasks.todo.length === 0) todoColumn.innerHTML = '<div class="text-center py-20 text-gray-600 empty-placeholder border-2 border-dashed border-white/5 rounded-xl"><p class="text-xs uppercase tracking-widest opacity-50">Empty Queue</p></div>';
            if (myTasks.doing.length === 0) doingColumn.innerHTML = '<div class="text-center py-20 text-gray-600 empty-placeholder border-2 border-dashed border-white/5 rounded-xl"><p class="text-xs uppercase tracking-widest opacity-50">No Active Operations</p></div>';
            if (myTasks.done.length === 0) doneColumn.innerHTML = '<div class="text-center py-20 text-gray-600 empty-placeholder border-2 border-dashed border-white/5 rounded-xl"><p class="text-xs uppercase tracking-widest opacity-50">Nothing Archived</p></div>';

            lucide.createIcons();
        }

        // Create Task Card
        function createTaskCard(task) {
            const card = document.createElement('div');
            const myAssignment = task.assignees.find(a => a.email === currentUser.email);
            const isMyTask = !!myAssignment;

            const priorityStyles = {
                high: 'text-red-400 bg-red-400/10 border-red-400/20',
                medium: 'text-yellow-400 bg-yellow-400/10 border-yellow-400/20',
                low: 'text-blue-400 bg-blue-400/10 border-blue-400/20'
            };

            const deadline = task.deadline ? getDaysUntil(task.deadline) : null;

            const assigneeAvatars = task.assignees.slice(0, 3).map(a => `
                <div class="${getAvatarColor(a.email)} w-6 h-6 rounded-lg border border-black/20 flex items-center justify-center text-white font-semibold text-[10px] -ml-1">
                    ${getFirstName(a.email).charAt(0)}
                </div>
            `).join('');

            const isTeamTask = task.assignees.length > 1;
            const myTaskBadge = isMyTask && isTeamTask ? '<span class="text-[10px] bg-white/10 text-gray-300 px-1.5 py-0.5 rounded border border-white/5">You</span>' : '';

            card.className = `task-card bg-black/60 backdrop-blur-sm border border-white/5 rounded-xl p-4 transition-all group ${isMyTask ? '' : 'not-draggable opacity-60'}`;
            card.dataset.taskId = task.id;
            card.onclick = () => openTaskDetailModal(task.id);

            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h4 class="font-semibold text-gray-200 group-hover:text-white transition-colors text-sm leading-snug pr-2">${task.title}</h4>
                    <span class="text-[10px] px-1.5 py-0.5 rounded border font-bold uppercase tracking-wider ${priorityStyles[task.priority]}">${task.priority.charAt(0)}</span>
                </div>
                
                <div class="flex items-center gap-2 mb-3">
                    ${myTaskBadge}
                </div>
                
                ${deadline ? `<div class="flex items-center gap-1.5 mb-3"><i data-lucide="calendar" class="w-3 h-3 ${deadline.color}"></i> <p class="text-xs ${deadline.color} font-medium font-mono">${deadline.text}</p></div>` : ''}
                
                <div class="flex items-center justify-between mt-auto pt-2 border-t border-white/5">
                    <div class="flex items-center pl-1">
                        ${assigneeAvatars}
                    </div>
                    ${isTeamTask ? `<span class="text-[10px] text-gray-600 font-mono">${task.assignees.filter(a => a.status === 'done').length}/${task.assignees.length}</span>` : ''}
                </div>
            `;

            return card;
        }

        // Initialize SortableJS
        function initializeSortable() {
            const columns = ['todoColumn', 'doingColumn', 'doneColumn'];
            const statusMap = {
                'todoColumn': 'todo',
                'doingColumn': 'doing',
                'doneColumn': 'done'
            };

            columns.forEach(columnId => {
                new Sortable(document.getElementById(columnId), {
                    group: 'kanban',
                    animation: 200,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    filter: '.not-draggable, .empty-placeholder',
                    onEnd: async function (evt) {
                        const taskId = parseInt(evt.item.dataset.taskId);
                        const newStatus = statusMap[evt.to.id];

                        await updateTaskStatus(taskId, newStatus);
                    }
                });
            });
        }

        // Update Task Status
        async function updateTaskStatus(taskId, newStatus) {
            try {
                const response = await fetch(`${API_BASE_URL}/tasks/${taskId}/my-status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    const statusTexts = { todo: 'Pending', doing: 'In Progress', done: 'Executed' };
                    showToast(`Status updated: ${statusTexts[newStatus]}`, 'success');
                    await fetchTasks();
                } else {
                    throw new Error('Failed to update task status');
                }
            } catch (error) {
                console.error('Error updating task:', error);
                showToast('Error updating task status', 'error');
                await fetchTasks(); // Revert UI
            }
        }

        // Modal Functions
        function openNewTaskModal() {
            document.getElementById('newTaskModal').classList.remove('hidden');
            setupNewTaskModal();
            lucide.createIcons();
        }

        function closeNewTaskModal() {
            document.getElementById('newTaskModal').classList.add('hidden');
            document.getElementById('newTaskForm').reset();
        }

        function setupNewTaskModal() {
            // Set deadline limits
            const today = new Date();
            const maxDate = new Date(today);
            maxDate.setDate(today.getDate() + 2);

            const deadlineInput = document.getElementById('taskDeadline');
            deadlineInput.min = today.toISOString().split('T')[0];
            deadlineInput.max = maxDate.toISOString().split('T')[0];

            // Assignment type handling
            const assignmentTypes = document.querySelectorAll('input[name="assignmentType"]');
            assignmentTypes.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'specific') {
                        document.getElementById('specificAssigneesSection').classList.remove('hidden');
                        populateAssignees();
                    } else {
                        document.getElementById('specificAssigneesSection').classList.add('hidden');
                    }
                });
            });
        }

        function populateAssignees() {
            const container = document.getElementById('assigneesList');
            container.innerHTML = '';

            currentProject.members.forEach(member => {
                const checkbox = document.createElement('label');
                checkbox.className = 'flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded-lg transition-colors border border-transparent hover:border-white/5';
                checkbox.innerHTML = `
                    <input type="checkbox" name="assignee" value="${member.email}" class="w-4 h-4 text-yellow-500 bg-black border-gray-600 rounded focus:ring-yellow-500 focus:ring-offset-black" />
                    <div class="${getAvatarColor(member.email)} w-8 h-8 rounded-lg border border-black/20 flex items-center justify-center font-bold text-xs">
                        ${getFirstName(member.email).charAt(0)}
                    </div>
                    <span class="text-gray-300 font-medium">${member.email}</span>
                `;
                container.appendChild(checkbox);
            });
        }

        // Create Task
        async function createTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const assignmentType = document.querySelector('input[name="assignmentType"]:checked').value;
            const priority = document.querySelector('input[name="priority"]:checked').value;
            const deadline = document.getElementById('taskDeadline').value;

            // Validation
            if (!title) {
                showToast('Please enter a directive title', 'error');
                return;
            }

            let assignees = [];
            if (assignmentType === 'me') {
                assignees = [currentUser.email];
            } else if (assignmentType === 'specific') {
                const checkboxes = document.querySelectorAll('input[name="assignee"]:checked');
                assignees = Array.from(checkboxes).map(cb => cb.value);
                if (assignees.length === 0) {
                    showToast('Select at least one operative', 'error');
                    return;
                }
            } else if (assignmentType === 'all') {
                assignees = ['ALL'];
            }

            // Show loading
            const btn = document.getElementById('createTaskBtn');
            const spinner = document.getElementById('createTaskSpinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/projects/${projectId}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        description: description || null,
                        assignees,
                        priority,
                        deadline: deadline ? new Date(deadline).toISOString() : null
                    })
                });

                if (response.ok) {
                    showToast('Directive executed.', 'success');
                    closeNewTaskModal();
                    await fetchTasks();
                } else {
                    const data = await response.json();
                    throw new Error(data.detail || 'Failed to create task');
                }
            } catch (error) {
                console.error('Error creating task:', error);
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        // Open Task Detail Modal
        async function openTaskDetailModal(taskId) {
            selectedTaskId = taskId;
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;

            const priorityStyles = {
                high: 'text-red-400 bg-red-400/10 border-red-400/20',
                medium: 'text-yellow-400 bg-yellow-400/10 border-yellow-400/20',
                low: 'text-blue-400 bg-blue-400/10 border-blue-400/20'
            };

            const assigneesList = task.assignees.map(a => {
                const statusIcons = {
                    todo: '⏳',
                    doing: '🔄',
                    done: '✅'
                };
                const statusStyles = {
                    todo: 'text-gray-400',
                    doing: 'text-blue-400',
                    done: 'text-green-400'
                };
                return `
                    <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                        <div class="flex items-center gap-3">
                            <div class="${getAvatarColor(a.email)} w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs shadow-lg">
                                ${getFirstName(a.email).charAt(0)}
                            </div>
                            <span class="text-sm text-gray-300 font-medium">${a.email}</span>
                        </div>
                        <span class="text-xs font-mono font-bold uppercase tracking-wider ${statusStyles[a.status]}">${statusIcons[a.status]} ${a.status.toUpperCase()}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('taskDetailContent').innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h4 class="text-3xl font-bold text-white mb-2 leading-tight">${task.title}</h4>
                        <span class="inline-block mt-1 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-widest border ${priorityStyles[task.priority]}">${task.priority.toUpperCase()} PRIORITY</span>
                    </div>
                    
                    ${task.description ? `
                        <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Details</p>
                            <p class="text-gray-300 leading-relaxed text-sm">${task.description}</p>
                        </div>
                    ` : ''}
                    
                    ${task.deadline ? `
                        <div class="flex items-center gap-3 text-sm">
                            <i data-lucide="calendar" class="w-4 h-4 text-yellow-500"></i>
                            <span class="text-gray-400">Target Deadline:</span>
                            <span class="text-white font-mono">${new Date(task.deadline).toLocaleDateString()}</span>
                        </div>
                    ` : ''}
                    
                    <div>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Assigned Operatives</p>
                        <div class="space-y-2">${assigneesList}</div>
                    </div>
                </div>
            `;

            document.getElementById('taskDetailModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeTaskDetailModal() {
            document.getElementById('taskDetailModal').classList.add('hidden');
            selectedTaskId = null;
        }

        // Delete Task
        async function deleteTask() {
            if (!selectedTaskId) return;
            if (!confirm('Are you sure you want to delete this directive? This action is irreversible.')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/tasks/${selectedTaskId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });

                if (response.ok) {
                    showToast('Directive terminated.', 'success');
                    closeTaskDetailModal();
                    await fetchTasks();
                } else {
                    throw new Error('Failed to delete task');
                }
            } catch (error) {
                console.error('Error deleting task:', error);
                showToast('Error deleting task', 'error');
            }
        }

        // Event Listeners
        document.getElementById('newTaskBtn').addEventListener('click', openNewTaskModal);
        document.getElementById('createTaskBtn').addEventListener('click', createTask);
        document.getElementById('deleteTaskBtn').addEventListener('click', deleteTask);
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) logout();
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (!currentUser) return;

            document.getElementById('userName').textContent = getFirstName(currentUser.email);

            // Get project ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            projectId = parseInt(urlParams.get('project_id'));

            if (!projectId) {
                showToast('No project selected', 'error');
                setTimeout(() => window.location.href = 'projects.html', 2000);
                return;
            }

            await fetchProject();
            await fetchTasks();
            initializeSortable();
            lucide.createIcons();
        });
    </script>
    <script src="nexus-theme.js"></script>
</body>

</html>
