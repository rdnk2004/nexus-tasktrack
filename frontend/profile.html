<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nutmeg · Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nutBlack: "#0b0f1a",
                        nutDeep: "#121a3a",
                        nutBlue: "#1e2a78",
                        nutViolet: "#6d5dfc",
                        nutNeon: "#9d8cff",
                        nutSoft: "#b8b0ff"
                    },
                    boxShadow: {
                        glow: "0 0 40px rgba(109,93,252,0.35)",
                    }
                }
            }
        }
    </script>
    <style>
        .fade-up {
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-nutBlack via-nutDeep to-black text-white">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top_right,rgba(109,93,252,0.1),transparent_50%)]"></div>

    <nav class="relative z-10 flex items-center justify-between px-8 py-6">
        <a href="workspace.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <span class="text-xl">←</span>
            <span class="text-sm text-gray-400">Back to Workspace</span>
        </a>
    </nav>

    <main class="relative z-10 px-8 py-8 max-w-4xl mx-auto">
        <div class="flex items-center gap-6 mb-12 fade-up">
            <div
                class="w-24 h-24 rounded-full bg-gradient-to-br from-nutViolet to-nutBlue flex items-center justify-center text-4xl font-light">
                <span id="userInitial">?</span>
            </div>
            <div>
                <h1 class="text-3xl font-light" id="userName">Loading...</h1>
                <p class="text-nutSoft text-sm mt-1" id="userEmail">...</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12 fade-up animation-delay-100">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-6">
                <h3 class="text-gray-400 text-xs uppercase tracking-wider mb-2">Active Projects</h3>
                <div class="flex items-end gap-2">
                    <span class="text-4xl font-bold text-white" id="statActive">0</span>
                    <span class="text-sm text-gray-500 mb-1">/ 2 max</span>
                </div>
                <div class="w-full bg-white/10 h-1 mt-4 rounded-full overflow-hidden">
                    <div id="loadingBar" class="h-full bg-nutNeon transition-all duration-1000 w-0"></div>
                </div>
            </div>

            <div class="bg-white/5 border border-white/10 rounded-2xl p-6">
                <h3 class="text-gray-400 text-xs uppercase tracking-wider mb-2">Completed</h3>
                <span class="text-4xl font-bold text-green-400" id="statDone">0</span>
                <p class="text-xs text-gray-500 mt-2">Projects delivered</p>
            </div>

            <div class="bg-white/5 border border-white/10 rounded-2xl p-6">
                <h3 class="text-gray-400 text-xs uppercase tracking-wider mb-2">Total Tasks</h3>
                <span class="text-4xl font-bold text-nutSoft" id="statTasks">0</span>
                <p class="text-xs text-gray-500 mt-2">Assigned to you</p>
            </div>
        </div>

        <div class="bg-white/5 border border-white/10 rounded-2xl p-8 fade-up animation-delay-200">
            <h2 class="text-xl font-light mb-6">Achievements</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="achievementsGrid">
                <!-- Badges -->
                <div class="flex flex-col items-center p-4 bg-black/20 rounded-xl opacity-50 grayscale"
                    id="badge-first">
                    <span class="text-2xl mb-2">🚀</span>
                    <span class="text-xs text-center font-medium">First Project</span>
                </div>
                <div class="flex flex-col items-center p-4 bg-black/20 rounded-xl opacity-50 grayscale"
                    id="badge-master">
                    <span class="text-2xl mb-2">🏆</span>
                    <span class="text-xs text-center font-medium">Project Master</span>
                </div>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireAuth()) return;
            const user = getCurrentUser();
            document.getElementById("userEmail").textContent = user;
            document.getElementById("userName").textContent = user.split('@')[0];
            document.getElementById("userInitial").textContent = user[0].toUpperCase();

            try {
                const stats = await apiGet("/user/stats");
                const tasks = await apiGet("/user/tasks");

                // Update Stats
                document.getElementById("statActive").textContent = stats.active_count;
                document.getElementById("statDone").textContent = stats.done_count;
                document.getElementById("statTasks").textContent = tasks.length;

                // Progress Bar for Active Projects (Max 2)
                const percentage = Math.min((stats.active_count / 2) * 100, 100);
                setTimeout(() => {
                    document.getElementById("loadingBar").style.width = percentage + "%";
                    if (stats.active_count >= 2) {
                        document.getElementById("loadingBar").classList.add("bg-red-400");
                        document.getElementById("loadingBar").classList.remove("bg-nutNeon");
                    }
                }, 100);

                // Badges Logic
                if (stats.total > 0) {
                    const b = document.getElementById("badge-first");
                    b.classList.remove("opacity-50", "grayscale");
                    b.classList.add("bg-nutViolet/20", "border", "border-nutViolet/30");
                }
                if (stats.done_count >= 3) {
                    const b = document.getElementById("badge-master");
                    b.classList.remove("opacity-50", "grayscale");
                    b.classList.add("bg-green-500/20", "border", "border-green-500/30");
                }

            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>

</html>
