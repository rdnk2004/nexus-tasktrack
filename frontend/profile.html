<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nutmeg · Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your detailed stats and achievements.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <style>
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--nut-violet) 0%, var(--nut-blue) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 0 20px rgba(109, 93, 252, 0.4);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.3s var(--ease-elastic);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.05);
        }

        .badge {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.4;
            filter: grayscale(100%);
            transition: all 0.3s ease;
        }

        .badge.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(109, 93, 252, 0.1);
            border-color: rgba(109, 93, 252, 0.3);
            box-shadow: 0 0 15px rgba(109, 93, 252, 0.2);
        }

        .progress-track {
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: var(--nut-neon);
            transition: width 1s var(--ease-elastic);
            box-shadow: 0 0 10px var(--nut-neon);
        }

        .progress-fill.limit-reached {
            background: var(--error);
            box-shadow: 0 0 10px var(--error);
        }
    </style>
</head>

<body>
    <div class="ambient-light"></div>

    <nav class="container pt-6 pb-2 relative z-10">
        <a href="workspace.html" class="flex items-center gap-2 opacity-60 hover:opacity-100 transition-opacity">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center">
                <span class="text-sm">🏠</span>
            </div>
            <span class="text-xs">Home</span>
        </a>
    </nav>

    <main class="container py-8 max-w-4xl relative z-10 animate-fade-up">

        <!-- Header -->
        <div class="flex items-center gap-6 mb-12">
            <div class="profile-avatar">
                <span id="userInitial">?</span>
            </div>
            <div>
                <h1 class="text-3xl mb-1" id="userName">Loading...</h1>
                <p class="text-sm text-neon opacity-80" id="userEmail">...</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-12 delay-100 animate-fade-up">

            <!-- Active Stats -->
            <div class="stat-card">
                <h3 class="text-xs uppercase tracking-wide text-gray-500 mb-2">Active Projects</h3>
                <div class="flex items-end gap-2">
                    <span class="text-4xl font-bold text-white" id="statActive">0</span>
                    <span class="text-sm text-gray-500 mb-2">/ 2 max</span>
                </div>
                <!-- Progress for limit -->
                <div class="progress-track">
                    <div id="loadingBar" class="progress-fill"></div>
                </div>
            </div>

            <!-- Completed Stats -->
            <div class="stat-card">
                <h3 class="text-xs uppercase tracking-wide text-gray-500 mb-2">Completed</h3>
                <span class="text-4xl font-bold text-success" id="statDone">0</span>
                <p class="text-xs text-gray-500 mt-2">Projects delivered</p>
            </div>

            <!-- Total Tasks Stats -->
            <div class="stat-card">
                <h3 class="text-xs uppercase tracking-wide text-gray-500 mb-2">Total Tasks</h3>
                <span class="text-4xl font-bold text-nut-soft" style="color: var(--nut-soft)" id="statTasks">0</span>
                <p class="text-xs text-gray-500 mt-2">Assigned to you</p>
            </div>

        </div>

        <!-- Achievements -->
        <div class="card p-8 delay-200 animate-fade-up">
            <h2 class="text-xl font-light mb-6">Achievements</h2>
            <div class="grid grid-cols-4 gap-4" id="achievementsGrid">

                <!-- Badge 1 -->
                <div class="badge" id="badge-first">
                    <span class="text-2xl mb-2">🚀</span>
                    <span class="text-xs text-center font-bold text-white">First Project</span>
                </div>

                <!-- Badge 2 -->
                <div class="badge" id="badge-master">
                    <span class="text-2xl mb-2">🏆</span>
                    <span class="text-xs text-center font-bold text-white">Project Master</span>
                </div>

                <!-- Placeholders -->
                <div class="badge opacity-20">
                    <span class="text-2xl mb-2">⚡</span>
                    <span class="text-xs text-center">Speed Demon</span>
                </div>
                <div class="badge opacity-20">
                    <span class="text-2xl mb-2">🤝</span>
                    <span class="text-xs text-center">Team Player</span>
                </div>

            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireAuth()) return;
            const user = getCurrentUser();
            document.getElementById("userEmail").textContent = user;
            document.getElementById("userName").textContent = user.split('@')[0];
            document.getElementById("userInitial").textContent = user[0].toUpperCase();

            try {
                const stats = await apiGet("/user/stats");
                const tasks = await apiGet("/user/tasks");

                // Update Stats
                document.getElementById("statActive").textContent = stats.active_count;
                document.getElementById("statDone").textContent = stats.done_count;
                document.getElementById("statTasks").textContent = tasks.length;

                // Progress Bar for Active Projects (Max 2)
                const percentage = Math.min((stats.active_count / 2) * 100, 100);
                setTimeout(() => {
                    const bar = document.getElementById("loadingBar");
                    bar.style.width = percentage + "%";

                    if (stats.active_count >= 2) {
                        bar.classList.add("limit-reached");
                    }
                }, 100);

                // Badges Logic
                if (stats.total > 0) {
                    document.getElementById("badge-first").classList.add("unlocked");
                }
                if (stats.done_count >= 3) {
                    document.getElementById("badge-master").classList.add("unlocked");
                }

            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>

</html>
