<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NEXUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .skeleton {
            animation: shimmer 2s infinite;
            background: linear-gradient(to right, #1a1a1a 4%, #333 25%, #1a1a1a 36%);
            background-size: 1000px 100%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>

    <!-- Production API Configuration -->
    <script>
        // Set production backend URL for Render deployment
        window.NUTMEG_API_URL = 'https://nutmeg-tasktracker.onrender.com';
    </script>
</head>

<body class="min-h-screen text-gray-300 selection:bg-yellow-500/30 overflow-x-hidden">



    <!-- Top Navigation Bar -->
    <nav class="bg-black/80 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo/Brand -->
                <div class="flex items-center gap-4">
                    <i data-lucide="network"
                        class="w-8 h-8 text-yellow-500 drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]"></i>
                    <span
                        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-500 tracking-tight">NEXUS</span>
                </div>

                <!-- Navigation Links (Desktop) -->
                <div class="hidden md:flex items-center gap-8">
                    <a href="dashboard.html"
                        class="text-yellow-500 font-medium border-b-2 border-yellow-500 pb-1 transition-all drop-shadow-[0_0_8px_rgba(255,215,0,0.3)]">
                        Dashboard
                    </a>
                    <a href="projects.html" class="text-gray-400 hover:text-white transition-colors font-medium">
                        Projects
                    </a>
                    <a href="profile.html" class="text-gray-400 hover:text-white transition-colors font-medium">
                        Profile
                    </a>
                </div>

                <!-- User Info & Logout -->
                <div class="flex items-center gap-6">
                    <div class="hidden sm:block text-right">
                        <p class="text-xs text-gray-500 uppercase tracking-wider">Operator</p>
                        <p id="userName" class="text-sm font-bold text-white">Loading...</p>
                    </div>
                    <button id="logoutBtn"
                        class="group bg-neutral-900 hover:bg-neutral-800 text-white px-4 py-2 rounded-xl transition-all border border-white/10 hover:border-red-500/50 flex items-center gap-2">
                        <i data-lucide="log-out"
                            class="w-4 h-4 text-gray-400 group-hover:text-red-500 transition-colors"></i>
                        <span class="hidden sm:inline text-sm font-medium">Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="md:hidden border-t border-white/10 px-4 py-3 flex gap-2 bg-black/90 backdrop-blur-md">
            <a href="dashboard.html"
                class="flex-1 text-center text-yellow-500 font-medium py-2 bg-yellow-500/10 rounded-lg border border-yellow-500/20">
                Dashboard
            </a>
            <a href="projects.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors">
                Projects
            </a>
            <a href="profile.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors">
                Profile
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10">
        <!-- Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Column 1: MY PROJECTS -->
            <div
                class="bg-neutral-900/60 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-2xl relative overflow-hidden group">
                <!-- Gradient Borders -->
                <div class="absolute inset-0 border border-white/5 rounded-2xl z-20 pointer-events-none"></div>
                <div
                    class="absolute -top-20 -right-20 w-40 h-40 bg-orange-500/10 blur-[50px] rounded-full pointer-events-none">
                </div>

                <div class="flex items-center justify-between mb-8 relative z-30">
                    <h2 class="text-lg font-bold text-white flex items-center gap-3 tracking-wide">
                        <i data-lucide="folder-kanban" class="w-5 h-5 text-orange-400"></i>
                        PROJECTS
                        <span id="projectCount"
                            class="bg-orange-500/20 border border-orange-500/30 text-orange-400 text-xs px-2 py-0.5 rounded-full">0</span>
                    </h2>
                    <button id="newProjectBtn"
                        class="text-gray-400 hover:text-orange-400 transition-colors transform hover:rotate-90 duration-300"
                        title="New Project">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Projects List -->
                <div id="projectsList" class="space-y-4 mb-6 relative z-30 min-h-[200px]">
                    <!-- Skeleton loaders shown while loading -->
                </div>

                <!-- Project Stats -->
                <div id="projectStats"
                    class="text-xs text-gray-500 mb-6 pb-4 border-b border-white/10 relative z-30 font-mono">
                    <!-- Stats will be inserted here -->
                </div>

                <!-- View All Button -->
                <a href="projects.html"
                    class="block text-center bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium py-3 rounded-xl transition-all border border-white/5 hover:border-white/20 relative z-30">
                    View All Projects
                </a>
            </div>

            <!-- Column 2: MY TASKS -->
            <div
                class="bg-neutral-900/60 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                <div
                    class="absolute -top-20 -left-20 w-40 h-40 bg-blue-500/10 blur-[50px] rounded-full pointer-events-none">
                </div>

                <div class="flex items-center justify-between mb-8 relative z-30">
                    <h2 class="text-lg font-bold text-white flex items-center gap-3 tracking-wide">
                        <i data-lucide="check-square" class="w-5 h-5 text-blue-400"></i>
                        PENDING TASKS
                        <span id="taskCount"
                            class="bg-blue-500/20 border border-blue-500/30 text-blue-400 text-xs px-2 py-0.5 rounded-full">0</span>
                    </h2>
                </div>

                <!-- Tasks List -->
                <div id="tasksList" class="space-y-3 mb-6 relative z-30 min-h-[200px]">
                    <!-- Skeleton loaders shown while loading -->
                </div>

                <!-- Task Summary -->
                <div id="taskSummary"
                    class="bg-green-500/10 border border-green-500/20 rounded-xl p-4 mb-6 text-sm text-green-400 relative z-30">
                    <!-- Summary will be inserted here -->
                </div>

                <!-- View All Button -->
                <a href="tasks.html"
                    class="block text-center bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium py-3 rounded-xl transition-all border border-white/5 hover:border-white/20 relative z-30">
                    View All Tasks
                </a>
            </div>

            <!-- Column 3: TEAM PULSE -->
            <div
                class="bg-neutral-900/60 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                <div
                    class="absolute -bottom-20 -right-20 w-40 h-40 bg-purple-500/10 blur-[50px] rounded-full pointer-events-none">
                </div>

                <div class="flex items-center justify-between mb-8 relative z-30">
                    <h2 class="text-lg font-bold text-white tracking-wide">TEAM PULSE</h2>
                    <div class="relative">
                        <span class="absolute -top-1 -right-1 flex h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                        <i data-lucide="activity" class="w-5 h-5 text-gray-400"></i>
                    </div>
                </div>

                <p class="text-xs text-gray-500 uppercase tracking-widest mb-6 relative z-30">Live Feed</p>

                <!-- Activity Feed -->
                <div id="activityFeed" class="space-y-6 mb-6 relative z-30 min-h-[200px]">
                    <!-- Skeleton loaders shown while loading -->
                </div>

            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script>
        // Authentication Check
        async function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return null;
            }

            try {
                // Validate token with backend
                const response = await fetch(`${API_BASE_URL}/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Invalid token');
                }

                const user = await response.json();
                return user;
            } catch (error) {
                console.error('Auth check failed:', error);
                // Clear localStorage and redirect to login
                removeToken();
                removeCurrentUser();
                window.location.href = 'login.html';
                return null;
            }
        }

        // Extract first name from email
        function getFirstName(email) {
            return email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1);
        }

        // Get relative time
        function getRelativeTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffSecs / 60);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffSecs < 60) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays === 1) return 'yesterday';
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString();
        }

        // Get days until deadline
        function getDaysUntil(dateString) {
            const deadline = new Date(dateString);
            const now = new Date();
            const diffMs = deadline - now;
            const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { text: `${Math.abs(diffDays)}d overdue`, color: 'text-red-400' };
            if (diffDays === 0) return { text: 'Due today', color: 'text-yellow-400' };
            if (diffDays === 1) return { text: '1d left', color: 'text-yellow-400' };
            if (diffDays <= 3) return { text: `${diffDays}d left`, color: 'text-orange-400' };
            return { text: `${diffDays}d left`, color: 'text-gray-500' };
        }

        // Show skeleton loaders
        function showSkeletons(containerId, count) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton h-20 rounded-xl opacity-10';
                container.appendChild(skeleton);
            }
        }

        // Fetch Projects
        async function fetchProjects() {
            showSkeletons('projectsList', 3);

            try {
                const token = getToken();
                const response = await fetch(`${API_BASE_URL}/projects`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch projects');

                const projects = await response.json();
                const activeProjects = projects.filter(p => p.status === 'active').slice(0, 3);
                const doneProjects = projects.filter(p => p.status === 'done').length;
                const archivedProjects = projects.filter(p => p.status === 'archived').length;

                document.getElementById('projectCount').textContent = activeProjects.length;

                // Display projects
                const projectsList = document.getElementById('projectsList');
                projectsList.innerHTML = '';

                if (activeProjects.length === 0) {
                    projectsList.innerHTML = `
                        <div class="text-center py-12 text-gray-600">
                            <i data-lucide="folder-open" class="w-10 h-10 mx-auto mb-3 opacity-50"></i>
                            <p class="text-sm">No active projects</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    activeProjects.forEach(project => {
                        const tasksDone = project.completed_tasks || 0;
                        const tasksTotal = project.total_tasks || 0;
                        const progress = tasksTotal > 0 ? (tasksDone / tasksTotal) * 100 : 0;
                        const deadline = project.end_date ? getDaysUntil(project.end_date) : null;

                        const projectCard = document.createElement('div');
                        projectCard.className = 'bg-black/40 border border-white/5 rounded-xl p-4 hover:bg-white/5 hover:border-orange-500/30 transition-all cursor-pointer group';
                        projectCard.onclick = () => window.location.href = `tasks.html?project_id=${project.id}`;

                        projectCard.innerHTML = `
                            <div class="flex items-start justify-between mb-3">
                                <h3 class="font-semibold text-gray-200 group-hover:text-white transition-colors text-sm">${project.name}</h3>
                                <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.5)]"></div>
                            </div>
                            <div class="mb-3">
                                <div class="flex justify-between text-[10px] text-gray-500 mb-2 uppercase tracking-wider font-mono">
                                    <span>${tasksDone}/${tasksTotal} tasks</span>
                                    <span>${Math.round(progress)}%</span>
                                </div>
                                <div class="w-full bg-white/5 rounded-full h-1">
                                    <div class="bg-gradient-to-r from-orange-600 to-orange-400 h-1 rounded-full transition-all shadow-[0_0_10px_rgba(249,115,22,0.3)]" style="width: ${progress}%"></div>
                                </div>
                            </div>
                            ${deadline ? `<p class="text-[10px] ${deadline.color} font-medium text-right">${deadline.text}</p>` : ''}
                        `;

                        projectsList.appendChild(projectCard);
                    });
                }

                // Display stats
                document.getElementById('projectStats').innerHTML = `
                    <div class="flex justify-between items-center px-2">
                        <span class="text-green-400">✅ ${doneProjects} Done</span>
                        <span class="text-gray-500">|</span>
                        <span class="text-purple-400">📦 ${archivedProjects} Archived</span>
                    </div>
                `;

            } catch (error) {
                console.error('Error fetching projects:', error);
                document.getElementById('projectsList').innerHTML = `
                    <div class="text-center py-8 text-red-500/50">
                        <p class="text-xs">Error loading projects</p>
                    </div>
                `;
            }
        }

        // Fetch Tasks
        async function fetchTasks() {
            showSkeletons('tasksList', 5);

            try {
                const token = getToken();
                const currentUser = getCurrentUser();
                const response = await fetch(`${API_BASE_URL}/user/tasks`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch tasks');

                const allTasks = await response.json();

                // Filter tasks where current user's status is not done
                const myTasks = allTasks.filter(task => {
                    const myAssignment = task.assignees.find(a => a.email === currentUser.email);
                    return myAssignment && myAssignment.status !== 'done';
                }).slice(0, 5);

                // Count tasks where current user completed
                const completedCount = allTasks.filter(task => {
                    const myAssignment = task.assignees.find(a => a.email === currentUser.email);
                    return myAssignment && myAssignment.status === 'done';
                }).length;

                document.getElementById('taskCount').textContent = myTasks.length;

                // Display tasks
                const tasksList = document.getElementById('tasksList');
                tasksList.innerHTML = '';

                if (myTasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="text-center py-12 text-gray-600">
                            <i data-lucide="check-circle" class="w-10 h-10 mx-auto mb-3 opacity-50"></i>
                            <p class="text-sm">No pending tasks</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    myTasks.forEach(task => {
                        const priorityStyles = {
                            'high': 'text-red-400 bg-red-400/10 border-red-400/20',
                            'urgent': 'text-red-500 bg-red-500/10 border-red-500/20',
                            'medium': 'text-yellow-400 bg-yellow-400/10 border-yellow-400/20',
                            'low': 'text-green-400 bg-green-400/10 border-green-400/20'
                        };
                        const deadline = task.deadline ? getDaysUntil(task.deadline) : null;

                        const taskCard = document.createElement('div');
                        taskCard.className = 'bg-black/40 border border-white/5 rounded-xl p-3 px-4 hover:bg-white/5 hover:border-blue-500/30 transition-all cursor-pointer group flex items-center justify-between gap-3';
                        taskCard.onclick = () => window.location.href = `tasks.html?project_id=${task.project_id}`;

                        taskCard.innerHTML = `
                            <div class="flex-1 min-w-0">
                                <h4 class="font-medium text-gray-300 group-hover:text-white truncate text-sm mb-1">${task.title}</h4>
                                <p class="text-[10px] text-gray-600 font-mono">Project #${task.project_id}</p>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <span class="text-[10px] px-2 py-0.5 rounded border ${priorityStyles[task.priority] || priorityStyles['low']} uppercase tracking-wider font-bold">${task.priority}</span>
                                ${deadline ? `<p class="text-[10px] ${deadline.color} font-medium">${deadline.text}</p>` : ''}
                            </div>
                        `;

                        tasksList.appendChild(taskCard);
                    });
                }

                // Display summary
                document.getElementById('taskSummary').innerHTML = `
                    <div class="flex items-center gap-2">
                        <i data-lucide="award" class="w-5 h-5"></i>
                        <span class="font-bold text-white">${completedCount}</span>
                        <span class="text-green-400/80">Tasks Completed Lifetime</span>
                    </div>
                `;

            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('tasksList').innerHTML = `
                    <div class="text-center py-8 text-red-500/50">
                        <p class="text-xs">Error loading tasks</p>
                    </div>
                `;
            }
        }

        // Fetch Activities
        async function fetchActivities() {
            showSkeletons('activityFeed', 5);

            try {
                const token = getToken();
                const response = await fetch(`${API_BASE_URL}/activities?limit=5`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch activities');

                const activities = await response.json();

                // Display activities
                const activityFeed = document.getElementById('activityFeed');
                activityFeed.innerHTML = '';

                if (activities.length === 0) {
                    activityFeed.innerHTML = `
                        <div class="text-center py-12 text-gray-600">
                            <i data-lucide="bell-off" class="w-10 h-10 mx-auto mb-3 opacity-50"></i>
                            <p class="text-sm">No recent activity</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    const avatarStyles = [
                        'bg-orange-500/20 text-orange-400 border-orange-500/30',
                        'bg-blue-500/20 text-blue-400 border-blue-500/30',
                        'bg-green-500/20 text-green-400 border-green-500/30',
                        'bg-purple-500/20 text-purple-400 border-purple-500/30',
                        'bg-pink-500/20 text-pink-400 border-pink-500/30'
                    ];

                    activities.forEach((activity, index) => {
                        const userName = activity.user_email ? getFirstName(activity.user_email) : 'User';
                        const initial = userName.charAt(0).toUpperCase();
                        const avatarStyle = avatarStyles[index % avatarStyles.length];
                        const timestamp = getRelativeTime(activity.created_at);

                        const activityItem = document.createElement('div');
                        activityItem.className = 'flex gap-4 group';

                        activityItem.innerHTML = `
                            <div class="${avatarStyle} w-8 h-8 rounded-lg border flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-[0_0_10px_rgba(0,0,0,0.5)]">
                                ${initial}
                            </div>
                            <div class="flex-1 min-w-0 pt-0.5">
                                <p class="text-sm text-gray-400 group-hover:text-gray-300 transition-colors leading-relaxed">${activity.description}</p>
                                <p class="text-[10px] text-gray-600 mt-1 font-mono">${timestamp}</p>
                            </div>
                        `;

                        activityFeed.appendChild(activityItem);
                    });
                }

            } catch (error) {
                console.error('Error fetching activities:', error);
                document.getElementById('activityFeed').innerHTML = `
                    <div class="text-center py-8 text-red-500/50">
                        <p class="text-xs">Error loading activity</p>
                    </div>
                `;
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) {
                logout();
            }
        });

        // New Project Button
        document.getElementById('newProjectBtn').addEventListener('click', () => {
            window.location.href = 'projects.html?action=new';
        });

        // Initialize Dashboard
        async function initDashboard() {
            const user = await checkAuth();
            if (!user) return;

            // Display user name
            document.getElementById('userName').textContent = getFirstName(user.email);

            // Fetch all data
            await Promise.all([
                fetchProjects(),
                fetchTasks(),
                fetchActivities()
            ]);

            // Initialize icons
            lucide.createIcons();
        }

        // Run on page load
        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
    <script src="nexus-theme.js"></script>
</body>

</html>
