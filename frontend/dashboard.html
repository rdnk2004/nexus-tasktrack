<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nutmeg Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050507;
        }

        .dashboard-card {
            background: rgba(18, 18, 24, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
    </style>
</head>

<body class="min-h-screen text-gray-200 selection:bg-amber-500/30 overflow-x-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-neutral-950/80 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 sm:h-20">
                <!-- Brand / Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                        <i data-lucide="layers" class="w-5 h-5 text-amber-400"></i>
                    </div>
                    <div>
                        <span class="text-xl font-black text-white tracking-tight">NUTMEG</span>
                        <span class="hidden sm:inline-block text-[10px] uppercase font-bold tracking-widest text-amber-400/80 bg-amber-400/10 px-2 py-0.5 rounded ml-2 border border-amber-400/20">Workspace</span>
                    </div>
                </div>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex items-center gap-8">
                    <a href="dashboard.html"
                        class="text-amber-400 font-semibold border-b-2 border-amber-400 pb-1 transition-all text-sm flex items-center gap-2">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        Dashboard
                    </a>
                    <a href="projects.html"
                        class="text-gray-400 hover:text-white transition-colors font-medium text-sm flex items-center gap-2">
                        <i data-lucide="folder-kanban" class="w-4 h-4"></i>
                        Projects
                    </a>
                    <a href="profile.html"
                        class="text-gray-400 hover:text-white transition-colors font-medium text-sm flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4"></i>
                        Profile
                    </a>
                </nav>

                <!-- User Info & Logout -->
                <div class="flex items-center gap-4 sm:gap-6">
                    <div class="hidden sm:flex items-center gap-3 pl-4 border-l border-white/10">
                        <div id="userAvatarPill" class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center font-bold text-xs">
                            U
                        </div>
                        <div class="text-left">
                            <p id="userName" class="text-xs font-bold text-white leading-tight">Loading...</p>
                            <p class="text-[10px] text-gray-400 font-medium">Team Member</p>
                        </div>
                    </div>
                    <button id="logoutBtn" type="button"
                        class="group bg-neutral-900 hover:bg-neutral-800 text-gray-300 hover:text-white px-3 sm:px-4 py-2 rounded-xl transition-all border border-white/10 hover:border-rose-500/40 flex items-center gap-2 text-xs font-semibold">
                        <i data-lucide="log-out" class="w-4 h-4 text-gray-400 group-hover:text-rose-400 transition-colors"></i>
                        <span class="hidden sm:inline">Sign Out</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Strip -->
        <nav class="md:hidden border-t border-white/10 px-4 py-2 flex gap-2 bg-black/60 backdrop-blur-md">
            <a href="dashboard.html"
                class="flex-1 text-center text-amber-400 font-semibold py-2 bg-amber-500/10 rounded-lg border border-amber-500/20 text-xs">
                Dashboard
            </a>
            <a href="projects.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors text-xs">
                Projects
            </a>
            <a href="profile.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors text-xs">
                Profile
            </a>
        </nav>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">

            <!-- Column 1: ACTIVE PROJECTS -->
            <section class="dashboard-card rounded-2xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-base font-bold text-white flex items-center gap-2.5 tracking-tight">
                            <i data-lucide="folder-kanban" class="w-5 h-5 text-amber-400"></i>
                            Active Projects
                            <span id="projectCount"
                                class="bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs px-2 py-0.5 rounded-full font-mono font-semibold">0</span>
                        </h2>
                        <button id="newProjectBtn" type="button"
                            class="p-1.5 rounded-lg bg-white/5 hover:bg-amber-500/20 text-gray-400 hover:text-amber-400 border border-white/5 hover:border-amber-500/30 transition-all"
                            title="Create Project">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Projects List Container -->
                    <div id="projectsList" class="space-y-3 mb-6 min-h-[220px]">
                        <!-- Skeletons injected here -->
                    </div>
                </div>

                <div>
                    <!-- Project Stats Summary -->
                    <div id="projectStats" class="text-xs text-gray-400 mb-4 pt-3 border-t border-white/5 font-medium">
                        <!-- Stats injected here -->
                    </div>

                    <!-- View All Projects CTA -->
                    <a href="projects.html"
                        class="block text-center bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium py-2.5 rounded-xl transition-all border border-white/5 hover:border-white/20 text-xs">
                        View All Projects &rarr;
                    </a>
                </div>
            </section>

            <!-- Column 2: MY PENDING TASKS -->
            <section class="dashboard-card rounded-2xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-base font-bold text-white flex items-center gap-2.5 tracking-tight">
                            <i data-lucide="check-square" class="w-5 h-5 text-blue-400"></i>
                            My Pending Tasks
                            <span id="taskCount"
                                class="bg-blue-500/15 border border-blue-500/30 text-blue-300 text-xs px-2 py-0.5 rounded-full font-mono font-semibold">0</span>
                        </h2>
                    </div>

                    <!-- Tasks List Container -->
                    <div id="tasksList" class="space-y-3 mb-6 min-h-[220px]">
                        <!-- Skeletons injected here -->
                    </div>
                </div>

                <div>
                    <!-- Lifetime Tasks Summary Badge -->
                    <div id="taskSummary"
                        class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3.5 mb-4 text-xs text-emerald-300 flex items-center gap-2.5">
                        <i data-lucide="award" class="w-4 h-4 text-emerald-400 flex-shrink-0"></i>
                        <span id="lifetimeTasksText" class="font-medium">Loading task history...</span>
                    </div>

                    <!-- View All Tasks CTA -->
                    <a href="projects.html"
                        class="block text-center bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium py-2.5 rounded-xl transition-all border border-white/5 hover:border-white/20 text-xs">
                        Open Project Kanban &rarr;
                    </a>
                </div>
            </section>

            <!-- Column 3: TEAM ACTIVITY PULSE -->
            <section class="dashboard-card rounded-2xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-base font-bold text-white flex items-center gap-2.5 tracking-tight">
                            <i data-lucide="activity" class="w-5 h-5 text-purple-400"></i>
                            Team Pulse
                        </h2>
                        <div class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Live</span>
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-500 uppercase tracking-wider mb-6">Recent Workspace Events</p>

                    <!-- Activity Feed Container -->
                    <div id="activityFeed" class="space-y-4 mb-4 min-h-[260px]">
                        <!-- Skeletons injected here -->
                    </div>
                </div>

                <div class="pt-3 border-t border-white/5 text-center">
                    <p class="text-[11px] text-gray-500">Auto-synced with workspace activities</p>
                </div>
            </section>

        </div>
    </main>

    <script src="utils.js"></script>
    <script>
        // Fetch Projects
        async function fetchProjects() {
            showSkeletons('projectsList', 3, 'h-20');

            try {
                const response = await authFetch('/projects');
                if (!response || !response.ok) throw new Error('Failed to fetch projects');

                const projects = await response.json();
                const activeProjects = projects.filter(p => p.status === 'active');
                const topActive = activeProjects.slice(0, 3);
                const doneProjects = projects.filter(p => p.status === 'done').length;
                const archivedProjects = projects.filter(p => p.status === 'archived').length;

                document.getElementById('projectCount').textContent = activeProjects.length;

                const projectsList = document.getElementById('projectsList');
                projectsList.innerHTML = '';

                if (topActive.length === 0) {
                    projectsList.innerHTML = `
                        <div class="text-center py-10 text-gray-500">
                            <i data-lucide="folder-open" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                            <p class="text-xs">No active projects currently.</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    topActive.forEach(project => {
                        const tasksDone = project.completed_tasks || 0;
                        const tasksTotal = project.total_tasks || 0;
                        const progress = tasksTotal > 0 ? (tasksDone / tasksTotal) * 100 : 0;
                        const deadline = project.end_date ? getDaysUntil(project.end_date) : null;

                        const card = document.createElement('div');
                        card.className = 'bg-black/40 border border-white/5 rounded-xl p-3.5 hover:bg-white/5 hover:border-amber-500/30 transition-all cursor-pointer group';
                        card.onclick = () => window.location.href = `tasks.html?project_id=${project.id}`;

                        card.innerHTML = `
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <h3 class="font-semibold text-gray-200 group-hover:text-white transition-colors text-sm truncate">${escapeHtml(project.name)}</h3>
                                <span class="w-2 h-2 bg-emerald-400 rounded-full flex-shrink-0 mt-1 shadow-[0_0_8px_rgba(52,211,153,0.5)]"></span>
                            </div>
                            <div class="mb-2.5">
                                <div class="flex justify-between text-[10px] text-gray-500 mb-1 font-mono">
                                    <span>${tasksDone}/${tasksTotal} tasks done</span>
                                    <span>${Math.round(progress)}%</span>
                                </div>
                                <div class="w-full bg-white/5 rounded-full h-1 overflow-hidden">
                                    <div class="bg-gradient-to-r from-amber-500 to-amber-400 h-full rounded-full transition-all" style="width: ${progress}%"></div>
                                </div>
                            </div>
                            ${deadline ? `<p class="text-[10px] ${deadline.color} font-medium text-right">${escapeHtml(deadline.text)}</p>` : ''}
                        `;

                        projectsList.appendChild(card);
                    });
                }

                document.getElementById('projectStats').innerHTML = `
                    <div class="flex justify-between items-center px-1">
                        <span class="text-emerald-400 font-semibold">${doneProjects} Completed</span>
                        <span class="text-gray-600">•</span>
                        <span class="text-purple-400 font-semibold">${archivedProjects} Archived</span>
                    </div>
                `;

            } catch (error) {
                console.error('Error fetching projects:', error);
                document.getElementById('projectsList').innerHTML = `
                    <div class="text-center py-6 text-rose-400/70 text-xs">
                        Unable to load projects
                    </div>
                `;
            }
        }

        // Fetch Tasks
        async function fetchTasks() {
            showSkeletons('tasksList', 4, 'h-16');

            try {
                const currentUser = getCurrentUser();
                const response = await authFetch('/user/tasks');
                if (!response || !response.ok) throw new Error('Failed to fetch tasks');

                const allTasks = await response.json();

                const myPendingTasks = allTasks.filter(task => {
                    const myAssignment = (task.assignees || []).find(a => a.email === currentUser?.email);
                    return myAssignment && myAssignment.status !== 'done';
                }).slice(0, 5);

                const completedCount = allTasks.filter(task => {
                    const myAssignment = (task.assignees || []).find(a => a.email === currentUser?.email);
                    return myAssignment && myAssignment.status === 'done';
                }).length;

                document.getElementById('taskCount').textContent = myPendingTasks.length;

                const tasksList = document.getElementById('tasksList');
                tasksList.innerHTML = '';

                if (myPendingTasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="text-center py-10 text-gray-500">
                            <i data-lucide="check-circle" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                            <p class="text-xs">All assigned tasks completed!</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    const priorityStyles = {
                        'urgent': 'text-rose-400 bg-rose-500/10 border-rose-500/20',
                        'high': 'text-rose-400 bg-rose-500/10 border-rose-500/20',
                        'medium': 'text-amber-400 bg-amber-500/10 border-amber-500/20',
                        'low': 'text-blue-400 bg-blue-500/10 border-blue-500/20'
                    };

                    myPendingTasks.forEach(task => {
                        const deadline = task.deadline ? getDaysUntil(task.deadline) : null;
                        const card = document.createElement('div');
                        card.className = 'bg-black/40 border border-white/5 rounded-xl p-3 hover:bg-white/5 hover:border-blue-500/30 transition-all cursor-pointer group flex items-center justify-between gap-3';
                        card.onclick = () => window.location.href = `tasks.html?project_id=${task.project_id}`;

                        card.innerHTML = `
                            <div class="flex-1 min-w-0">
                                <h4 class="font-medium text-gray-200 group-hover:text-white truncate text-xs mb-1">${escapeHtml(task.title)}</h4>
                                <span class="text-[10px] text-gray-500 font-mono">Project #${task.project_id}</span>
                            </div>
                            <div class="flex flex-col items-end gap-1 flex-shrink-0">
                                <span class="text-[10px] px-2 py-0.5 rounded border font-semibold uppercase tracking-wider ${priorityStyles[task.priority] || priorityStyles['low']}">${escapeHtml(task.priority)}</span>
                                ${deadline ? `<span class="text-[10px] ${deadline.color} font-medium">${escapeHtml(deadline.text)}</span>` : ''}
                            </div>
                        `;

                        tasksList.appendChild(card);
                    });
                }

                document.getElementById('lifetimeTasksText').innerHTML = `
                    <strong>${completedCount}</strong> tasks completed lifetime
                `;

            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('tasksList').innerHTML = `
                    <div class="text-center py-6 text-rose-400/70 text-xs">
                        Unable to load tasks
                    </div>
                `;
            }
        }

        // Fetch Activities
        async function fetchActivities() {
            showSkeletons('activityFeed', 4, 'h-14');

            try {
                const response = await authFetch('/activities?limit=5');
                if (!response || !response.ok) throw new Error('Failed to fetch activities');

                const activities = await response.json();
                const feed = document.getElementById('activityFeed');
                feed.innerHTML = '';

                if (activities.length === 0) {
                    feed.innerHTML = `
                        <div class="text-center py-10 text-gray-500">
                            <i data-lucide="bell-off" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                            <p class="text-xs">No recent activity found.</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    activities.forEach(activity => {
                        const userName = activity.user_email ? getFirstName(activity.user_email) : 'User';
                        const initial = userName.charAt(0).toUpperCase();
                        const avatarStyle = getAvatarColor(activity.user_email);
                        const timestamp = getRelativeTime(activity.created_at);

                        const item = document.createElement('div');
                        item.className = 'flex items-start gap-3 text-left group';

                        item.innerHTML = `
                            <div class="${avatarStyle} w-7 h-7 rounded-lg border flex items-center justify-center font-bold text-xs flex-shrink-0 mt-0.5">
                                ${initial}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs text-gray-300 leading-snug group-hover:text-white transition-colors">${escapeHtml(activity.description)}</p>
                                <span class="text-[10px] text-gray-500 font-mono mt-0.5 block">${escapeHtml(timestamp)}</span>
                            </div>
                        `;

                        feed.appendChild(item);
                    });
                }

            } catch (error) {
                console.error('Error fetching activities:', error);
                document.getElementById('activityFeed').innerHTML = `
                    <div class="text-center py-6 text-rose-400/70 text-xs">
                        Unable to load activity feed
                    </div>
                `;
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const confirmed = await showConfirm({
                title: 'Sign Out',
                message: 'Are you sure you want to end your current session?',
                confirmText: 'Sign Out',
                cancelText: 'Stay',
                danger: false
            });
            if (confirmed) logout();
        });

        // Quick Project Creation
        document.getElementById('newProjectBtn').addEventListener('click', () => {
            window.location.href = 'projects.html?action=new';
        });

        // Initialize Dashboard
        async function initDashboard() {
            const user = await checkAuth();
            if (!user) return;

            const name = getFirstName(user.email);
            document.getElementById('userName').textContent = name;
            document.getElementById('userAvatarPill').textContent = name.charAt(0);

            await Promise.all([
                fetchProjects(),
                fetchTasks(),
                fetchActivities()
            ]);

            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
    <script src="nexus-theme.js"></script>
</body>

</html>
