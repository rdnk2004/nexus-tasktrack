<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutmeg Task Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-10px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(10px);
            }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.5s ease-out;
        }
    </style>

    <!-- Production API Configuration -->
    <script>
        // Set production backend URL for Render deployment
        window.NUTMEG_API_URL = 'https://nutmeg-tasktracker.onrender.com';
    </script>
</head>

<body class="min-h-screen bg-black flex items-center justify-center p-4 selection:bg-yellow-500/30">

    <!-- Background Effects -->


    <!-- Login Card -->
    <div id="loginCard"
        class="relative z-10 bg-neutral-900/80 backdrop-blur-[20px] border border-white/10 rounded-3xl shadow-[0_0_40px_-10px_rgba(0,0,0,0.7)] w-full max-w-md p-10 slide-in overflow-hidden">

        <!-- Shine Effect -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white/20 to-transparent">
        </div>

        <!-- Logo and Title -->
        <div class="text-center mb-10">
            <h1
                class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-500 mb-2 tracking-tight">
                NEXUS</h1>
            <p class="text-gray-400 text-sm tracking-widest uppercase">Project NLP & RAG • Internal</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <!-- Email Dropdown -->
            <div>
                <label for="email" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                    Identity
                </label>
                <div class="relative group">
                    <select id="email" name="email" required
                        class="w-full px-4 py-4 bg-black/50 border border-neutral-800 text-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500 transition-all duration-300 appearance-none cursor-pointer outline-none hover:border-gray-700">
                        <option value="" class="bg-neutral-900 text-gray-500">Select Access ID</option>
                        <option value="nikhil@nutmeg.com" class="bg-neutral-900 text-white">nikhil@nutmeg.com</option>
                        <option value="jayasree@nutmeg.com" class="bg-neutral-900 text-white">jayasree@nutmeg.com
                        </option>
                        <option value="nandana@nutmeg.com" class="bg-neutral-900 text-white">nandana@nutmeg.com</option>
                        <option value="hafeez@nutmeg.com" class="bg-neutral-900 text-white">hafeez@nutmeg.com</option>
                    </select>
                    <i data-lucide="chevron-down"
                        class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 group-hover:text-yellow-500 transition-colors duration-300 w-5 h-5 pointer-events-none"></i>
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                    Key Code
                </label>
                <div class="relative group">
                    <input type="password" id="password" name="password" required placeholder="Enter key code"
                        class="w-full px-4 py-4 pr-12 bg-black/50 border border-neutral-800 text-gray-200 rounded-xl focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500 transition-all duration-300 placeholder-gray-700 outline-none hover:border-gray-700" />
                    <button type="button" id="togglePassword"
                        class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-600 hover:text-white transition-colors duration-200 focus:outline-none p-1"
                        aria-label="Toggle password visibility">
                        <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Login Button -->
            <button type="submit" id="loginButton"
                class="w-full bg-gradient-to-r from-yellow-700 via-yellow-500 to-yellow-700 hover:from-yellow-600 hover:via-yellow-400 hover:to-yellow-600 text-black font-extrabold py-4 px-4 rounded-xl transition-all duration-500 transform hover:scale-[1.02] active:scale-[0.98] shadow-[0_0_20px_rgba(255,190,0,0.2)] hover:shadow-[0_0_30px_rgba(255,215,0,0.4)] flex items-center justify-center gap-3 mt-8">
                <span id="buttonText" class="tracking-wide">INITIALIZE</span>
                <i data-lucide="arrow-right" id="loginIcon" class="w-5 h-5"></i>
                <!-- Loading Spinner -->
                <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-black"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center border-t border-white/5 pt-6">
            <p class="text-gray-600 text-[10px] tracking-widest uppercase">
                Nexus System v2.0 • 2026
            </p>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        // Password Toggle Functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Update icon
            eyeIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        });

        // Form Submission
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const buttonText = document.getElementById('buttonText');
        const loginIcon = document.getElementById('loginIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loginCard = document.getElementById('loginCard');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get form values
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validate fields
            if (!email || !password) {
                showToast('Please fill in all fields', 'error');
                loginCard.classList.add('shake');
                setTimeout(() => loginCard.classList.remove('shake'), 500);
                return;
            }

            // Show loading state
            loginButton.disabled = true;
            buttonText.textContent = 'Logging in...';
            loginIcon.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');

            try {
                // Make API request
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Success - store token and user info
                    setToken(data.access_token);
                    setCurrentUser({ email: data.email });


                    showToast('Login successful! Redirecting...', 'success');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    // Error response from server
                    throw new Error(data.detail || 'Invalid credentials');
                }
            } catch (error) {
                // Handle errors
                console.error('Login error:', error);

                if (error.message.includes('Failed to fetch')) {
                    showToast('Cannot connect to server. Please check if the backend is running.', 'error');
                } else {
                    showToast(error.message || 'Login failed. Please try again.', 'error');
                }

                // Shake animation
                loginCard.classList.add('shake');
                setTimeout(() => loginCard.classList.remove('shake'), 500);

                // Reset button state
                loginButton.disabled = false;
                buttonText.textContent = 'Login';
                loginIcon.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
            }
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (token) {
                window.location.href = 'dashboard.html';
            }
        });

        // Enter key submits form (already handled by form submit event)
        // Tab navigation works automatically with proper HTML structure
    </script>
    <script src="nexus-theme.js"></script>
</body>

</html>
