<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nutmeg · Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your tasks and deadlines on a calendar.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body class="overflow-hidden">
    <!-- Prevent body scroll, let grid handle overflowing content if needed, though typically calendar fits -->
    <div class="ambient-light"></div>

    <nav class="container pt-6 pb-4 relative z-10 flex items-center justify-between">
        <a href="workspace.html" class="flex items-center gap-2 opacity-60 hover:opacity-100 transition-opacity">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center">
                <span class="text-sm">🏠</span>
            </div>
            <span class="text-xs">Home</span>
        </a>

        <div class="text-xl font-light tracking-widest text-white" id="monthLabel">JANUARY 2026</div>

        <div class="flex gap-2">
            <button onclick="changeMonth(-1)"
                class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 transition-colors">←</button>
            <button onclick="changeMonth(1)"
                class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 transition-colors">→</button>
        </div>
    </nav>

    <main class="container px-6 pb-6 h-[calc(100vh-100px)] flex flex-col relative z-10 animate-fade-up">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 mb-2">
            <div class="calendar-header-day">Sun</div>
            <div class="calendar-header-day">Mon</div>
            <div class="calendar-header-day">Tue</div>
            <div class="calendar-header-day">Wed</div>
            <div class="calendar-header-day">Thu</div>
            <div class="calendar-header-day">Fri</div>
            <div class="calendar-header-day">Sat</div>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid flex-1" id="calendarGrid">
            <!-- Days injected Here -->
        </div>
    </main>

    <script>
        let currentDate = new Date();
        // Set default view to 2026 as per original file intent, or utilize current year
        currentDate.setFullYear(2026);
        currentDate.setMonth(0); // Jan

        let tasks = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireAuth()) return;
            await loadTasks();
            renderCalendar();
        });

        async function loadTasks() {
            try {
                tasks = await apiGet("/user/tasks");
            } catch (e) { console.error("Failed handling tasks", e); }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update Header
            const monthName = currentDate.toLocaleString('default', { month: 'long' });
            document.getElementById("monthLabel").innerText = `${monthName.toUpperCase()} ${year}`;

            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Padding for previous month
            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement("div");
                div.className = "pointer-events-none"; // Empty spacer
                grid.appendChild(div);
            }

            // Days
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                // ISO String format for comparison: YYYY-MM-DD
                const offsetDate = new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000));
                const dayStr = offsetDate.toISOString().split('T')[0];

                // Find tasks for this day
                const dayTasks = tasks.filter(t => {
                    if (!t.deadline) return false;
                    const tDate = new Date(t.deadline).toISOString().split('T')[0];
                    return tDate === dayStr;
                });

                const cell = document.createElement("div");
                cell.className = "calendar-cell group"; // Defined in style.css

                // Highlight Today
                const now = new Date();
                let isToday = now.getFullYear() === year && now.getMonth() === month && now.getDate() === d;
                if (isToday) cell.classList.add("today");

                // Stagger animation
                cell.style.animation = `fadeUp 0.5s var(--ease-elastic) backwards`;
                cell.style.animationDelay = (d * 0.02) + "s";

                let taskHtml = "";
                dayTasks.forEach(t => {
                    const statusClass = t.status === 'done' ? 'done' : '';
                    taskHtml += `<div class="calendar-task ${statusClass}" title="${t.title}">${t.title}</div>`;
                });

                cell.innerHTML = `
                    <div class="calendar-day-label">${d}</div>
                    <div class="flex flex-col gap-1 overflow-y-auto" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;">
                        ${taskHtml}
                    </div>
                `;

                // Click interaction
                if (dayTasks.length > 0) {
                    cell.onclick = () => {
                        // Go to the first task's project
                        if (dayTasks[0].project_id) window.location.href = `projects.html?id=${dayTasks[0].project_id}`;
                    };
                }

                grid.appendChild(cell);
            }
        }
    </script>
</body>

</html>
