<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nutmeg · Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nutBlack: "#0b0f1a",
                        nutDeep: "#121a3a",
                        nutBlue: "#1e2a78",
                        nutViolet: "#6d5dfc",
                        nutNeon: "#9d8cff",
                        nutSoft: "#b8b0ff"
                    },
                    boxShadow: { glow: "0 0 40px rgba(109,93,252,0.35)" }
                }
            }
        }
    </script>
    <style>
        .fade-up {
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar for task lists inside days */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>

<body class="min-h-screen bg-black text-white font-sans overflow-hidden">
    <div
        class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(109,93,252,0.15),transparent_70%)] pointer-events-none">
    </div>

    <nav class="relative z-10 flex items-center justify-between px-8 py-6">
        <a href="workspace.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <span class="text-xl">←</span>
            <span class="text-sm text-gray-400">Workspace</span>
        </a>
        <div class="text-2xl font-light tracking-widest" id="monthLabel">JANUARY 2026</div>
        <div class="flex gap-2">
            <button onclick="changeMonth(-1)"
                class="w-8 h-8 rounded-full glass flex items-center justify-center hover:bg-white/10">←</button>
            <button onclick="changeMonth(1)"
                class="w-8 h-8 rounded-full glass flex items-center justify-center hover:bg-white/10">→</button>
        </div>
    </nav>

    <main class="relative z-10 px-8 pb-8 h-[calc(100vh-100px)] flex flex-col">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 mb-4 text-center">
            <div class="text-gray-500 text-xs uppercase tracking-widest">Sun</div>
            <div class="text-gray-500 text-xs uppercase tracking-widest">Mon</div>
            <div class="text-gray-500 text-xs uppercase tracking-widest">Tue</div>
            <div class="text-gray-500 text-xs uppercase tracking-widest">Wed</div>
            <div class="text-gray-500 text-xs uppercase tracking-widest">Thu</div>
            <div class="text-gray-500 text-xs uppercase tracking-widest">Fri</div>
            <div class="text-gray-500 text-xs uppercase tracking-widest">Sat</div>
        </div>

        <!-- Calendar Grid -->
        <div class="grid grid-cols-7 grid-rows-5 gap-4 flex-1 transition-all duration-300" id="calendarGrid">
            <!-- Days injected Here -->
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        let currentDate = new Date();
        // Set default view to 2026 as requested
        currentDate.setFullYear(2026);
        currentDate.setMonth(0); // Jan

        let tasks = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireAuth()) return;
            await loadTasks();
            renderCalendar();
        });

        async function loadTasks() {
            try {
                // Uses Phase 7 endpoint
                tasks = await apiGet("/user/tasks");
            } catch (e) { console.error("Failed handling tasks", e); }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update Header
            const monthName = currentDate.toLocaleString('default', { month: 'long' });
            document.getElementById("monthLabel").innerText = `${monthName.toUpperCase()} ${year}`;

            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Padding for previous month
            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement("div");
                div.className = "bg-transparent pointer-events-none";
                grid.appendChild(div);
            }

            // Days
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                // ISO String format for comparison: YYYY-MM-DD
                // Adjust for timezone offset to avoid "off by one" errors
                const offsetDate = new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000));
                const dayStr = offsetDate.toISOString().split('T')[0];

                // Find tasks for this day
                const dayTasks = tasks.filter(t => {
                    if (!t.deadline) return false;
                    const tDate = new Date(t.deadline).toISOString().split('T')[0];
                    return tDate === dayStr;
                });

                const div = document.createElement("div");
                div.className = "glass rounded-2xl p-3 relative group hover:bg-white/5 transition-all flex flex-col gap-1 overflow-hidden cursor-pointer fade-up min-h-[100px]";
                div.style.animationDelay = (d * 0.015) + "s";

                // Highlight Today
                const now = new Date();
                let isToday = now.getFullYear() === year && now.getMonth() === month && now.getDate() === d;

                let dayClass = isToday ? "text-nutNeon font-bold bg-nutNeon/10 w-8 h-8 rounded-full flex items-center justify-center -ml-2 -mt-2 mb-1" : "text-gray-400 text-sm mb-1";

                let taskHtml = "";
                dayTasks.forEach(t => {
                    // Status colors
                    let borderClass = 'border-nutViolet';
                    let textClass = 'text-white';
                    if (t.status === 'done') {
                        borderClass = 'border-green-400 opacity-50';
                        textClass = 'text-gray-400 line-through';
                    }
                    taskHtml += `<div class="text-[10px] bg-white/10 px-2 py-1 rounded truncate border-l-2 ${borderClass} ${textClass} hover:bg-white/20 transition-colors" title="${t.title}">${t.title}</div>`;
                });

                div.innerHTML = `
                    <div class="${dayClass}">${d}</div>
                    <div class="flex flex-col gap-1 overflow-y-auto custom-scrollbar h-full pb-2">
                        ${taskHtml}
                    </div>
                `;

                // Click interaction
                if (dayTasks.length > 0) {
                    div.onclick = () => {
                        // In a real app this opens a modal. Here we verify logic via alert/log or just visual.
                        console.log(`Clicked ${dayStr}, tasks:`, dayTasks);
                        // Optional: navigate to project of first task
                        if (dayTasks[0].project_id) window.location.href = `project.html?id=${dayTasks[0].project_id}`;
                    };
                }

                grid.appendChild(div);
            }
        }
    </script>
</body>

</html>
