<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nutmeg · Workspace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your personal productivity dashboard.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <style>
        /* Local overrides for specific chart visualizations */
        .chart-bar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s var(--ease-elastic);
        }

        .chart-bar:hover {
            background: rgba(109, 93, 252, 0.4);
            transform: scaleY(1.05);
            transform-origin: bottom;
        }
    </style>
</head>

<body>
    <!-- Background Elements -->
    <div class="ambient-light"></div>

    <div class="container py-12" style="padding-top: 4rem; padding-bottom: 4rem;">

        <!-- Header -->
        <header class="dashboard-header flex justify-between items-center animate-fade-up delay-100 pb-8">
            <div>
                <p class="text-sm opacity-80 mb-2" id="dateDisplay">Loading date...</p>
                <h1>
                    <span id="greeting" class="font-light">Hello</span>, <br />
                    <span id="userName" class="text-neon">User</span>
                </h1>
            </div>
            <div class="flex gap-4">
                <a href="profile.html" class="btn btn-secondary btn-sm">
                    👤 Profile
                </a>
                <button onclick="logout()" class="btn btn-sm text-sm"
                    style="background: transparent; color: var(--nut-gray);">
                    Sign out
                </button>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 md:grid-cols-12 animate-fade-up delay-200">

            <!-- Left Col: Quick Nav & Tasks -->
            <div class="col-span-1 md:col-span-4 flex flex-col gap-6 md:gap-8">

                <div class="grid grid-cols-2 gap-4 md:gap-6">
                    <a href="projects.html"
                        class="card p-6 md:p-8 hover:scale-[1.01] cursor-pointer flex flex-col justify-between h-48 group border-transparent bg-white/5 hover:bg-white/10">
                        <div class="text-2xl opacity-50 group-hover:opacity-100 transition-opacity">📂</div>
                        <div>
                            <h3 class="text-lg font-medium">Projects</h3>
                            <p class="text-sm opacity-50 mt-1" id="projectCount">Loading...</p>
                        </div>
                    </a>

                    <a href="calendar.html"
                        class="card p-6 md:p-8 hover:scale-[1.01] cursor-pointer flex flex-col justify-between h-48 group border-transparent bg-white/5 hover:bg-white/10">
                        <div class="text-2xl opacity-50 group-hover:opacity-100 transition-opacity">📅</div>
                        <div>
                            <h3 class="text-lg font-medium">Calendar</h3>
                            <p class="text-sm opacity-50 mt-1">Schedule</p>
                        </div>
                    </a>
                </div>

                <!-- Assigned To Me (Cleaner) -->
                <div class="card p-8 md:p-10 flex-1 min-h-[400px]">
                    <div class="flex items-center justify-between mb-8">
                        <h3 class="text-xs uppercase tracking-widest text-gray-500">Your Focus</h3>
                        <span class="text-xs text-gray-600">Priority</span>
                    </div>

                    <div id="myTasksList" class="flex flex-col gap-4">
                        <!-- Loading State -->
                        <div class="animate-pulse flex flex-col gap-4">
                            <div class="h-12 bg-white/5 rounded-xl w-full"></div>
                            <div class="h-12 bg-white/5 rounded-xl w-2/3"></div>
                        </div>
                    </div>

                    <div id="emptyTasks"
                        class="hidden flex flex-col items-center justify-center h-full text-gray-500 opacity-50 pb-10">
                        <span class="text-2xl mb-4">☕</span>
                        <p class="text-sm">No tasks assigned.</p>
                    </div>
                </div>

            </div>

            <!-- Right Col: Team Pulse (Minimal) -->
            <div class="col-span-1 md:col-span-8">
                <div class="card p-8 md:p-12 h-full">
                    <div class="flex justify-between items-baseline mb-10">
                        <h2 class="text-2xl font-light">Team Pulse</h2>
                        <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]"></span>
                    </div>

                    <div class="flex flex-col gap-6">
                        <!-- Mock Pulse Item - Minimal -->
                        <div class="flex items-start gap-5 p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                            <div
                                class="mt-1 w-2 h-2 rounded-full bg-blue-500 opacity-50 group-hover:opacity-100 transition-opacity">
                            </div>
                            <div class="flex-1">
                                <p class="text-base text-gray-200">
                                    <span class="text-white font-medium">New Project</span> added by Nikhil.
                                </p>
                                <p class="text-sm text-gray-600 mt-1">"Q1 Marketing Goals"</p>
                            </div>
                            <span class="text-xs text-gray-700">2h ago</span>
                        </div>

                        <!-- Mock Pulse Item - Minimal -->
                        <div class="flex items-start gap-5 p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                            <div
                                class="mt-1 w-2 h-2 rounded-full bg-violet-500 opacity-50 group-hover:opacity-100 transition-opacity">
                            </div>
                            <div class="flex-1">
                                <p class="text-base text-gray-200">
                                    <span class="text-white font-medium">Task Completed</span> in Website Redesign.
                                </p>
                                <p class="text-sm text-gray-600 mt-1">"Fix Navigation Bug"</p>
                            </div>
                            <span class="text-xs text-gray-700">4h ago</span>
                        </div>
                    </div>

                    <!-- Chart Area - clean -->
                    <div class="mt-auto pt-12">
                        <div
                            class="flex items-end gap-3 h-40 opacity-30 hover:opacity-100 transition-opacity duration-1000">
                            <!-- Minimal Bars -->
                            <div class="flex-1 bg-white rounded-t-lg h-[40%]"></div>
                            <div class="flex-1 bg-white rounded-t-lg h-[70%]"></div>
                            <div class="flex-1 bg-white rounded-t-lg h-[30%]"></div>
                            <div
                                class="flex-1 bg-violet-500 shadow-[0_0_20px_rgba(109,93,252,0.5)] rounded-t-lg h-[90%]">
                            </div>
                            <div class="flex-1 bg-white rounded-t-lg h-[60%]"></div>
                            <div class="flex-1 bg-white rounded-t-lg h-[50%]"></div>
                            <div class="flex-1 bg-white rounded-t-lg h-[70%]"></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        async function init() {
            if (!requireAuth()) return;

            const user = getCurrentUser();
            document.getElementById("userName").textContent = user.split("@")[0];

            // Date
            const dateOpts = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById("dateDisplay").textContent = new Date().toLocaleDateString('en-US', dateOpts);

            // Greeting based on time
            const hour = new Date().getHours();
            let greet = "Good evening";
            if (hour < 12) greet = "Good morning";
            else if (hour < 18) greet = "Good afternoon";
            document.getElementById("greeting").textContent = greet;

            // Load Data
            loadDashboardData();
        }

        async function loadDashboardData() {
            try {
                // 1. Stats
                const stats = await apiGet("/user/stats");
                document.getElementById("projectCount").textContent = `${stats.active_count} active projects`;

                // 2. My Tasks
                const tasks = await apiGet("/user/tasks");
                renderMyTasks(tasks);

            } catch (err) {
                console.error("Dashboard load error", err);
            }
        }

        function renderMyTasks(tasks) {
            const container = document.getElementById("myTasksList");
            const empty = document.getElementById("emptyTasks");
            container.innerHTML = "";

            if (!tasks || tasks.length === 0) {
                empty.classList.remove("hidden");
                return;
            }

            // Show first 4
            tasks.slice(0, 4).forEach(task => {
                const div = document.createElement("div");
                div.className = "group flex items-center justify-between p-3 rounded-xl hover:bg-white/5 transition-colors cursor-pointer border border-transparent hover:border-white/5";

                div.onclick = () => window.location.href = `projects.html?id=${task.project_id}`;

                // Status Dot
                const statusColor = task.status === 'done' ? 'bg-green-400' : 'bg-nut-neon shadow-glow';

                // Deadline
                let timeHtml = "";
                if (task.deadline) {
                    const d = new Date(task.deadline);
                    const now = new Date();
                    const diff = (d - now) / (1000 * 3600 * 24);

                    if (diff < 0) {
                        timeHtml = `<span class="text-error text-xs font-bold">Overdue</span>`;
                    } else {
                        timeHtml = `<span class="text-gray-500 text-xs">${Math.ceil(diff)}d left</span>`;
                    }
                }

                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="div w-2 h-2 rounded-full ${task.status === 'done' ? 'bg-success' : 'bg-nut-violet'}"></div>
                        <div class="truncate">
                            <p class="text-sm text-white group-hover:text-neon transition-colors truncate">${task.title}</p>
                            <p class="text-xs text-gray-500">by ${task.created_by ? task.created_by.split("@")[0] : 'Someone'}</p>
                        </div>
                    </div>
                    ${timeHtml}
                `;
                container.appendChild(div);
            });
        }

        function logout() {
            clearToken();
            window.location.href = "index.html";
        }

        init();
    </script>
</body>

</html>
