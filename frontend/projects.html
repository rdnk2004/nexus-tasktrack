<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - NEXUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Flatpickr Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .skeleton {
            animation: shimmer 2s infinite;
            background: linear-gradient(to right, #1a1a1a 4%, #333 25%, #1a1a1a 36%);
            background-size: 1000px 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-backdrop {
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>

<body class="min-h-screen text-gray-300 selection:bg-yellow-500/30 overflow-x-hidden">



    <!-- Top Navigation Bar -->
    <nav class="bg-black/80 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo/Brand -->
                <div class="flex items-center gap-4">
                    <i data-lucide="network"
                        class="w-8 h-8 text-yellow-500 drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]"></i>
                    <span
                        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-500 tracking-tight">NEXUS</span>
                </div>

                <!-- Navigation Links (Desktop) -->
                <div class="hidden md:flex items-center gap-8">
                    <a href="dashboard.html" class="text-gray-400 hover:text-white transition-colors font-medium">
                        Dashboard
                    </a>
                    <a href="projects.html"
                        class="text-yellow-500 font-medium border-b-2 border-yellow-500 pb-1 transition-all drop-shadow-[0_0_8px_rgba(255,215,0,0.3)]">
                        Projects
                    </a>
                    <a href="profile.html" class="text-gray-400 hover:text-white transition-colors font-medium">
                        Profile
                    </a>
                </div>

                <!-- User Info & Logout -->
                <div class="flex items-center gap-6">
                    <div class="hidden sm:block text-right">
                        <p class="text-xs text-gray-500 uppercase tracking-wider">Operator</p>
                        <p id="userName" class="text-sm font-bold text-white">Loading...</p>
                    </div>
                    <button id="logoutBtn"
                        class="group bg-neutral-900 hover:bg-neutral-800 text-white px-4 py-2 rounded-xl transition-all border border-white/10 hover:border-red-500/50 flex items-center gap-2">
                        <i data-lucide="log-out"
                            class="w-4 h-4 text-gray-400 group-hover:text-red-500 transition-colors"></i>
                        <span class="hidden sm:inline text-sm font-medium">Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="md:hidden border-t border-white/10 px-4 py-3 flex gap-2 bg-black/90 backdrop-blur-md">
            <a href="dashboard.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors">
                Dashboard
            </a>
            <a href="projects.html"
                class="flex-1 text-center text-yellow-500 font-medium py-2 bg-yellow-500/10 rounded-lg border border-yellow-500/20">
                Projects
            </a>
            <a href="profile.html"
                class="flex-1 text-center text-gray-400 py-2 hover:bg-white/5 rounded-lg transition-colors">
                Profile
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10">

        <!-- Page Header -->
        <div class="mb-10">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                <h1 class="text-4xl font-black text-white tracking-tight flex items-center gap-4">
                    <span
                        class="bg-gradient-to-r from-yellow-500 to-yellow-200 text-transparent bg-clip-text">PROJECTS</span>
                    <span class="text-2xl text-gray-600 font-light">Directory</span>
                </h1>
                <button id="newProjectBtn"
                    class="bg-gradient-to-r from-yellow-700 via-yellow-600 to-yellow-700 hover:from-yellow-600 hover:to-yellow-600 text-black px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(255,215,0,0.2)] hover:shadow-[0_0_25px_rgba(255,215,0,0.4)]">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    Initialize Project
                </button>
            </div>

            <!-- Filter Tabs -->
            <div class="flex gap-4 border-b border-white/10 overflow-x-auto">
                <button id="filterAll"
                    class="filter-tab px-6 py-3 font-semibold text-yellow-500 border-b-2 border-yellow-500 transition-all hover:text-yellow-400 whitespace-nowrap"
                    data-filter="all">
                    All Systems
                </button>
                <button id="filterIndividual"
                    class="filter-tab px-6 py-3 font-semibold text-gray-500 hover:text-white transition-colors whitespace-nowrap"
                    data-filter="individual">
                    Individual
                </button>
                <button id="filterCollaborative"
                    class="filter-tab px-6 py-3 font-semibold text-gray-500 hover:text-white transition-colors whitespace-nowrap"
                    data-filter="collaborative">
                    Collaborative
                </button>
            </div>
        </div>

        <!-- Active Projects Section -->
        <section class="mb-16">
            <h2 class="text-xl font-bold text-gray-200 mb-6 flex items-center gap-3 tracking-wide">
                <span
                    class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_rgba(34,197,94,0.8)] animate-pulse"></span>
                ACTIVE PROTOCOLS
                <span id="activeCount"
                    class="bg-white/10 border border-white/10 text-gray-300 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
            </h2>
            <div id="activeProjectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Projects will be inserted here -->
            </div>
        </section>

        <!-- Completed Projects Section -->
        <section>
            <h2 class="text-xl font-bold text-gray-500 mb-6 flex items-center gap-3 tracking-wide">
                <i data-lucide="archive" class="w-5 h-5"></i>
                ARCHIVED / COMPLETED
                <span id="completedCount"
                    class="bg-white/5 border border-white/5 text-gray-600 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
            </h2>
            <div id="completedProjectsGrid"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 opacity-60 hover:opacity-100 transition-opacity duration-300">
                <!-- Projects will be inserted here -->
            </div>
        </section>
    </main>

    <!-- New Project Modal -->
    <div id="projectModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="flex min-h-screen items-center justify-center p-4">
            <div
                class="modal-content bg-neutral-900 border border-white/10 rounded-3xl shadow-[0_0_50px_-20px_rgba(0,0,0,1)] w-full max-w-2xl relative z-10 overflow-hidden">

                <!-- Shine Header -->
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-yellow-500/50 to-transparent">
                </div>

                <!-- Modal Header -->
                <div class="border-b border-white/10 px-8 py-6 flex justify-between items-center bg-black/20">
                    <h3 class="text-2xl font-bold text-white tracking-tight">Initialize New Project</h3>
                    <button onclick="closeModal()"
                        class="text-gray-500 hover:text-white transition-colors p-2 hover:bg-white/5 rounded-full">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Warning if 2 active projects -->
                <div id="projectLimitWarning"
                    class="hidden bg-yellow-900/20 border-l-4 border-yellow-500/50 p-4 mx-8 mt-6">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i data-lucide="alert-triangle" class="w-5 h-5 text-yellow-500"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-yellow-200/80">
                                <strong class="text-yellow-400">System Limit:</strong> 2/2 Active Protocols. Archive
                                existing protocols to initiate new ones.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Modal Body -->
                <form id="projectForm" class="px-8 py-6 space-y-6">
                    <!-- Project Name -->
                    <div>
                        <label for="projectName"
                            class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                            Project Designation
                        </label>
                        <input type="text" id="projectName" required placeholder="Enter project name"
                            class="w-full px-5 py-4 bg-black/50 border border-neutral-800 text-white rounded-xl focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500/50 transition-all text-lg placeholder-gray-700 outline-none" />
                    </div>

                    <!-- Project Description -->
                    <div>
                        <label for="projectDescription"
                            class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                            Description (Optional)
                        </label>
                        <textarea id="projectDescription" rows="3"
                            class="w-full px-5 py-4 bg-black/50 border border-neutral-800 text-white rounded-xl focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500/50 transition-all outline-none resize-none placeholder-gray-700"
                            placeholder="Describe your project..."></textarea>
                    </div>

                    <!-- Project Type -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">
                            Operation Type
                        </label>
                        <div class="flex gap-4">
                            <label
                                class="flex items-center gap-3 cursor-pointer group bg-neutral-800/50 p-3 pr-5 rounded-lg border border-transparent hover:border-white/10 transition-all">
                                <input type="radio" name="projectType" value="individual" checked
                                    class="w-4 h-4 text-yellow-500 bg-black border-gray-600 focus:ring-yellow-500 focus:ring-offset-black" />
                                <span class="text-gray-300 group-hover:text-white transition-colors">Individual</span>
                            </label>
                            <label
                                class="flex items-center gap-3 cursor-pointer group bg-neutral-800/50 p-3 pr-5 rounded-lg border border-transparent hover:border-white/10 transition-all">
                                <input type="radio" name="projectType" value="collaborative"
                                    class="w-4 h-4 text-yellow-500 bg-black border-gray-600 focus:ring-yellow-500 focus:ring-offset-black" />
                                <span
                                    class="text-gray-300 group-hover:text-white transition-colors">Collaborative</span>
                            </label>
                        </div>
                    </div>

                    <!-- Collaborators (shown only for collaborative) -->
                    <div id="collaboratorsSection" class="hidden">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">
                            Assign Operatives
                        </label>
                        <div id="collaboratorsList"
                            class="space-y-2 bg-black/30 p-4 rounded-xl border border-white/5 max-h-40 overflow-y-auto custom-scrollbar">
                            <!-- Collaborator checkboxes will be inserted here -->
                        </div>
                    </div>

                    <!-- End Date -->
                    <div>
                        <label for="endDate"
                            class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                            Deadline Target
                            <span class="text-[10px] text-gray-600 font-normal ml-2">(1-14 days limit)</span>
                        </label>
                        <input type="date" id="endDate" required
                            class="w-full px-5 py-4 bg-black/50 border border-neutral-800 text-white rounded-xl focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500/50 transition-all outline-none text-gray-300" />
                    </div>
                </form>

                <!-- Modal Footer -->
                <div class="border-t border-white/10 px-8 py-6 flex justify-end gap-3 bg-black/20">
                    <button onclick="closeModal()"
                        class="px-6 py-3 border border-white/10 text-gray-400 rounded-xl hover:bg-white/5 hover:text-white transition-colors font-medium">
                        Abort
                    </button>
                    <button id="createProjectBtn"
                        class="px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-black rounded-xl transition-all font-bold flex items-center gap-2 shadow-[0_0_15px_rgba(234,179,8,0.2)] hover:shadow-[0_0_20px_rgba(234,179,8,0.4)]">
                        <span>Execute</span>
                        <svg id="createSpinner" class="hidden animate-spin h-5 w-5 text-black"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Extend Project Deadline Modal -->
    <div id="extendModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm" onclick="closeExtendModal()"></div>
        <div class="flex min-h-screen items-center justify-center p-4">
            <div
                class="modal-content bg-neutral-900 border border-white/10 rounded-3xl shadow-[0_0_50px_-20px_rgba(0,0,0,1)] w-full max-w-lg relative z-10 overflow-hidden">

                <!-- Shine Header -->
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-yellow-500/50 to-transparent">
                </div>

                <!-- Modal Header -->
                <div class="border-b border-white/10 px-8 py-6 flex justify-between items-center bg-black/20">
                    <h3 class="text-2xl font-bold text-white tracking-tight">Extend Project Deadline</h3>
                    <button onclick="closeExtendModal()"
                        class="text-gray-500 hover:text-white transition-colors p-2 hover:bg-white/5 rounded-full">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-8 py-6 space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                            Current Deadline
                        </label>
                        <p id="currentDeadline" class="text-lg font-bold text-white mb-4"></p>
                    </div>

                    <div>
                        <label for="newEndDate"
                            class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                            New Deadline
                        </label>
                        <input type="date" id="newEndDate" required
                            class="w-full px-5 py-4 bg-black/50 border border-neutral-800 text-white rounded-xl focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500/50 transition-all outline-none text-gray-300" />
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="border-t border-white/10 px-8 py-6 flex justify-end gap-3 bg-black/20">
                    <button onclick="closeExtendModal()"
                        class="px-6 py-3 border border-white/10 text-gray-400 rounded-xl hover:bg-white/5 hover:text-white transition-colors font-medium">
                        Cancel
                    </button>
                    <button id="extendDeadlineBtn"
                        class="px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-black rounded-xl transition-all font-bold flex items-center gap-2 shadow-[0_0_15px_rgba(234,179,8,0.2)] hover:shadow-[0_0_20px_rgba(234,179,8,0.4)]">
                        <span>Extend</span>
                        <svg id="extendSpinner" class="hidden animate-spin h-5 w-5 text-black"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        let allProjects = [];
        let currentFilter = 'all';
        let currentUser = null;

        // Modal Functions
        function openModal() {
            document.getElementById('projectModal').classList.remove('hidden');
            setupModal();
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('projectModal').classList.add('hidden');
            document.getElementById('projectForm').reset();
            document.getElementById('collaboratorsSection').classList.add('hidden');
        }

        function setupModal() {
            // Set default end date (+7 days)
            const today = new Date();
            const defaultEndDate = new Date(today);
            defaultEndDate.setDate(today.getDate() + 7);

            const minDate = new Date(today);
            minDate.setDate(today.getDate() + 1);

            const maxDate = new Date(today);
            maxDate.setDate(today.getDate() + 14);

            // Initialize Flatpickr on end date input
            flatpickr("#endDate", {
                defaultDate: defaultEndDate,
                minDate: minDate,
                maxDate: maxDate,
                dateFormat: "Y-m-d",
                theme: "dark",
                disableMobile: true
            });

            // Check if user has 2 active projects
            const activeProjectsCount = allProjects.filter(p => p.status === 'active').length;
            if (activeProjectsCount >= 2) {
                document.getElementById('projectLimitWarning').classList.remove('hidden');
            } else {
                document.getElementById('projectLimitWarning').classList.add('hidden');
            }
        }

        async function populateCollaborators() {
            const container = document.getElementById('collaboratorsList');
            container.innerHTML = '';

            try {
                const response = await authFetch('/users');
                if (!response || !response.ok) throw new Error('Failed to load users');
                const users = await response.json();

                // Exclude current user and test account
                const otherUsers = users.filter(email => email !== currentUser?.email && email !== 'test@nutmeg.com');

                otherUsers.forEach(email => {
                    const checkbox = document.createElement('label');
                    checkbox.className = 'flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded-lg transition-colors border border-transparent hover:border-white/5';
                    checkbox.innerHTML = `
                        <input 
                            type="checkbox" 
                            name="collaborator" 
                            value="${escapeHtml(email)}"
                            class="w-4 h-4 text-yellow-500 bg-black border-gray-600 rounded focus:ring-yellow-500 focus:ring-offset-black"
                        />
                        <div class="${getAvatarColor(email)} w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs border border-white/5">
                            ${escapeHtml(getFirstName(email).charAt(0))}
                        </div>
                        <span class="text-gray-300 font-medium">${escapeHtml(email)}</span>
                    `;
                    container.appendChild(checkbox);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Fetch Projects
        async function fetchProjects() {
            try {
                const response = await authFetch('/projects');
                if (!response || !response.ok) throw new Error('Failed to fetch projects');
                allProjects = await response.json();
                renderProjects();
            } catch (error) {
                console.error('Error fetching projects:', error);
                showToast('Error loading projects', 'error');
            }
        }

        // Render Projects
        function renderProjects() {
            const activeGrid = document.getElementById('activeProjectsGrid');
            const completedGrid = document.getElementById('completedProjectsGrid');

            let filteredProjects = allProjects;
            if (currentFilter === 'individual') {
                filteredProjects = allProjects.filter(p => !p.is_collaborative);
            } else if (currentFilter === 'collaborative') {
                filteredProjects = allProjects.filter(p => p.is_collaborative);
            }

            const activeProjects = filteredProjects.filter(p => p.status === 'active');
            const completedProjects = filteredProjects.filter(p => p.status === 'done' || p.status === 'archived');

            document.getElementById('activeCount').textContent = activeProjects.length;
            document.getElementById('completedCount').textContent = completedProjects.length;

            // Render active projects
            if (activeProjects.length === 0) {
                activeGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-600">
                        <i data-lucide="folder-open" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
                        <p class="text-lg">No active protocols initialized.</p>
                    </div>
                `;
            } else {
                activeGrid.innerHTML = activeProjects.map(project => createProjectCard(project, 'active')).join('');
            }

            // Render completed projects
            if (completedProjects.length === 0) {
                completedGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-600">
                        <i data-lucide="check-circle" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
                        <p class="text-lg">Archive is empty.</p>
                    </div>
                `;
            } else {
                completedGrid.innerHTML = completedProjects.map(project => createProjectCard(project, project.status === 'archived' ? 'archived' : 'completed')).join('');
            }

            lucide.createIcons();
        }

        // Create Project Card HTML
        function createProjectCard(project, type) {
            const isCreator = project.created_by === currentUser?.email;
            const typeBadgeColor = project.is_collaborative ? 'bg-purple-900/30 text-purple-300 border-purple-500/20' : 'bg-blue-900/30 text-blue-300 border-blue-500/20';
            const typeBadgeText = project.is_collaborative ? 'Collaborative' : 'Individual';

            const progress = project.total_tasks > 0 ? (project.completed_tasks / project.total_tasks) * 100 : 0;

            let deadlineInfo = '';
            let cardOpacity = '';

            if (type === 'active') {
                if (project.end_date) {
                    const deadline = getDaysUntil(project.end_date);
                    const urgencyClass = deadline.urgency === 'high' ? 'bg-red-500/10 border-red-500/30 text-red-400' :
                        deadline.urgency === 'medium' ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-500' :
                            'bg-white/5 border-white/10 text-gray-400';
                    deadlineInfo = `
                        <div class="${urgencyClass} border rounded-lg p-2 mb-4 text-xs font-mono flex justify-between">
                            <span>Target: ${escapeHtml(formatDate(project.end_date))}</span>
                            <span class="font-bold">${escapeHtml(deadline.text)}</span>
                        </div>
                    `;
                }
            } else {
                cardOpacity = 'opacity-75 grayscale-[50%] hover:grayscale-0';
            }

            // Collaborator avatars
            const collaboratorAvatars = (project.members || []).slice(0, 3).map(member => `
                <div class="${getAvatarColor(member.email)} w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs border-2 border-black -ml-2 ring-1 ring-white/10">
                    ${escapeHtml(getFirstName(member.email).charAt(0))}
                </div>
            `).join('');

            const moreCount = (project.members || []).length > 3 ? `
                <div class="w-8 h-8 rounded-full bg-neutral-800 flex items-center justify-center text-gray-400 text-xs font-semibold border-2 border-black -ml-2 ring-1 ring-white/10">
                    +${project.members.length - 3}
                </div>
            ` : '';

            const cardBg = type === 'active'
                ? 'bg-neutral-900/80 hover:bg-neutral-900 border-white/10 hover:border-yellow-500/40 shadow-[0_0_20px_-5px_rgba(0,0,0,0.5)] hover:shadow-[0_0_25px_-5px_rgba(255,215,0,0.15)]'
                : 'bg-neutral-900/40 border-white/5 hover:border-white/20';

            return `
                <div class="${cardBg} border rounded-2xl p-6 transition-all duration-300 group ${cardOpacity}">
                    <!-- Header -->
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-gray-200 mb-2 group-hover:text-white transition-colors">${escapeHtml(project.name)}</h3>
                            <span class="inline-block px-2 py-0.5 rounded border text-[10px] uppercase tracking-wider font-semibold ${typeBadgeColor}">
                                ${typeBadgeText}
                            </span>
                        </div>
                        ${type === 'active' ? `<div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>` : ''}
                        ${type === 'completed' ? `<i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>` : ''}
                        ${type === 'archived' ? `<i data-lucide="archive" class="w-5 h-5 text-gray-500"></i>` : ''}
                    </div>

                    <!-- Collaborators -->
                    <div class="flex items-center mb-5 ml-2 min-h-[32px]">
                        ${collaboratorAvatars}
                        ${moreCount}
                    </div>

                    <!-- Progress -->
                    <div class="mb-5">
                        <div class="flex justify-between text-xs text-gray-500 mb-2 font-mono">
                            <span>${project.completed_tasks || 0}/${project.total_tasks || 0} TASKS</span>
                            <span>${Math.round(progress)}%</span>
                        </div>
                        <div class="w-full bg-white/5 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-yellow-600 to-yellow-400 h-full rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(255,200,0,0.3)]" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    ${deadlineInfo}

                    <!-- Actions -->
                    <div class="flex gap-2 mt-auto">
                        <button 
                            onclick="window.location.href='tasks.html?project_id=${project.id}'"
                            class="flex-1 bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white py-2 px-4 rounded-lg font-medium transition-colors text-sm border border-white/5 hover:border-white/20"
                        >
                            ${type === 'active' ? 'Access' : 'Review'}
                        </button>
                        ${type === 'active' ? `
                            <button 
                                onclick="openExtendModal(${project.id})"
                                class="bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/20 hover:border-blue-500/40 py-2 px-3 rounded-lg font-semibold transition-colors"  
                                title="Extend Deadline"
                            >
                                <i data-lucide="clock" class="w-4 h-4"></i>
                            </button>
                            <button 
                                onclick="markProjectDone(${project.id}, ${isCreator})"
                                class="${isCreator ? 'bg-green-500/10 hover:bg-green-500/20 text-green-400 border border-green-500/10 hover:border-green-500/30' : 'bg-neutral-800 text-gray-600 cursor-not-allowed border border-transparent'} py-2 px-3 rounded-lg font-semibold transition-colors disabled:opacity-50"
                                ${!isCreator ? 'disabled title="Only creator can mark as done"' : 'title="Complete Protocol"'}
                            >
                                <i data-lucide="check" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                        ${type !== 'archived' && (type === 'completed' || type === 'active') ? `
                            <button 
                                onclick="archiveProject(${project.id})"
                                class="bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white py-2 px-3 rounded-lg font-semibold transition-colors border border-white/5 hover:border-white/20"
                                title="Archive"
                            >
                                <i data-lucide="archive" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                        ${type === 'archived' ? `
                            <button 
                                onclick="deleteProject(${project.id})"
                                class="bg-red-900/20 hover:bg-red-900/40 text-red-400 border border-red-500/20 hover:border-red-500/40 py-2 px-3 rounded-lg font-semibold transition-colors"
                                title="Delete Project"
                            >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Create Project
        async function createProject() {
            const name = document.getElementById('projectName').value.trim();
            const type = document.querySelector('input[name="projectType"]:checked').value;
            const endDate = document.getElementById('endDate').value;

            if (!name) {
                showToast('Please enter a project name', 'error');
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const selectedDate = new Date(endDate);
            selectedDate.setHours(0, 0, 0, 0);
            const diffDays = Math.ceil((selectedDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 1 || diffDays > 14) {
                showToast('End date must be 1-14 days from today', 'error');
                return;
            }

            let collaborators = [];
            if (type === 'collaborative') {
                const checkboxes = document.querySelectorAll('input[name="collaborator"]:checked');
                collaborators = Array.from(checkboxes).map(cb => cb.value);

                if (collaborators.length === 0) {
                    showToast('Please select at least one collaborator', 'error');
                    return;
                }
            }

            const btn = document.getElementById('createProjectBtn');
            const spinner = document.getElementById('createSpinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const response = await authFetch('/projects', {
                    method: 'POST',
                    body: JSON.stringify({
                        name,
                        description: document.getElementById('projectDescription').value.trim(),
                        members: collaborators,
                        start_date: new Date().toISOString(),
                        end_date: `${endDate}T23:59:59Z`
                    })
                });

                if (!response) return;
                const data = await response.json();

                if (response.ok) {
                    showToast('Project initialized successfully.', 'success');
                    closeModal();
                    await fetchProjects();
                } else {
                    throw new Error(data.detail || 'Failed to create project');
                }
            } catch (error) {
                console.error('Error creating project:', error);
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        // Mark Project as Done
        async function markProjectDone(projectId, isCreator) {
            if (!isCreator) {
                showToast('Only the project creator can mark it as done', 'warning');
                return;
            }

            const confirmed = await showConfirm({
                title: 'Complete Protocol',
                message: 'Mark this protocol as complete? This cannot be undone.',
                confirmText: 'Complete',
                cancelText: 'Cancel'
            });
            if (!confirmed) return;

            try {
                const response = await authFetch(`/projects/${projectId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: 'done' })
                });

                if (response && response.ok) {
                    showToast('Protocol complete.', 'success');
                    await fetchProjects();
                } else {
                    throw new Error('Failed to update project');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error updating project', 'error');
            }
        }

        // Archive Project
        async function archiveProject(projectId) {
            const confirmed = await showConfirm({
                title: 'Archive Protocol',
                message: 'Archive this protocol? It will be moved to storage and you can delete it later.',
                confirmText: 'Archive',
                cancelText: 'Cancel'
            });
            if (!confirmed) return;

            try {
                const response = await authFetch(`/projects/${projectId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: 'archived' })
                });

                if (response && response.ok) {
                    showToast('Project archived.', 'success');
                    await fetchProjects();
                } else {
                    throw new Error('Failed to archive project');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error archiving project', 'error');
            }
        }

        // Extend Project Modal
        let extendingProjectId = null;

        function openExtendModal(projectId) {
            const project = allProjects.find(p => p.id === projectId);
            if (!project) return;

            extendingProjectId = projectId;
            document.getElementById('currentDeadline').textContent = new Date(project.end_date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

            const currentDate = new Date(project.end_date);
            const minDate = new Date(currentDate);
            minDate.setDate(currentDate.getDate() + 1);

            flatpickr("#newEndDate", {
                defaultDate: minDate,
                minDate: minDate,
                dateFormat: "Y-m-d",
                theme: "dark",
                disableMobile: true
            });

            document.getElementById('extendModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeExtendModal() {
            document.getElementById('extendModal').classList.add('hidden');
            extendingProjectId = null;
        }

        async function extendDeadline() {
            const newEndDate = document.getElementById('newEndDate').value;
            if (!newEndDate) {
                showToast('Please select a new deadline', 'error');
                return;
            }

            const btn = document.getElementById('extendDeadlineBtn');
            const spinner = document.getElementById('extendSpinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const response = await authFetch(`/projects/${extendingProjectId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ end_date: `${newEndDate}T23:59:59Z` })
                });

                if (response && response.ok) {
                    showToast('Project deadline extended successfully', 'success');
                    closeExtendModal();
                    await fetchProjects();
                } else {
                    throw new Error('Failed to extend deadline');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error extending deadline', 'error');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        // Delete Project Function
        async function deleteProject(projectId) {
            const confirmed = await showConfirm({
                title: 'Delete Project',
                message: 'Permanently delete this archived project? This action cannot be undone.',
                confirmText: 'Delete',
                cancelText: 'Cancel',
                danger: true
            });
            if (!confirmed) return;

            try {
                const response = await authFetch(`/projects/${projectId}`, {
                    method: 'DELETE'
                });

                if (response && response.ok) {
                    showToast('Project deleted successfully', 'success');
                    await fetchProjects();
                } else {
                    const data = await response.json();
                    throw new Error(data.detail || 'Failed to delete project');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast(error.message, 'error');
            }
        }

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tab').forEach(t => {
                    t.classList.remove('text-yellow-500', 'border-b-2', 'border-yellow-500');
                    t.classList.add('text-gray-500');
                });
                e.target.classList.remove('text-gray-500');
                e.target.classList.add('text-yellow-500', 'border-b-2', 'border-yellow-500');

                currentFilter = e.target.dataset.filter;
                renderProjects();
            });
        });

        // Event Listeners
        document.getElementById('newProjectBtn').addEventListener('click', openModal);
        document.getElementById('createProjectBtn').addEventListener('click', createProject);
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const confirmed = await showConfirm({
                title: 'Logout',
                message: 'Are you sure you want to end your session?',
                confirmText: 'Logout',
                cancelText: 'Stay'
            });
            if (confirmed) logout();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const typeRadios = document.querySelectorAll('input[name="projectType"]');
            typeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'collaborative') {
                        document.getElementById('collaboratorsSection').classList.remove('hidden');
                        populateCollaborators();
                    } else {
                        document.getElementById('collaboratorsSection').classList.add('hidden');
                    }
                });
            });

            document.getElementById('extendDeadlineBtn').addEventListener('click', extendDeadline);

            currentUser = await checkAuth();
            if (!currentUser) return;

            document.getElementById('userName').textContent = getFirstName(currentUser.email);

            await fetchProjects();
            lucide.createIcons();

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'new') {
                openModal();
            }
        });
    </script>
    <script src="nexus-theme.js"></script>
</body>

</html>
