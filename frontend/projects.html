<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Nutmeg Task Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .skeleton {
            animation: shimmer 2s infinite;
            background: linear-gradient(to right, #f0f0f0 4%, #e0e0e0 25%, #f0f0f0 36%);
            background-size: 1000px 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-backdrop {
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo/Brand -->
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🥜</span>
                    <span class="text-xl font-bold text-orange-500">NUTMEG</span>
                </div>

                <!-- Navigation Links (Desktop) -->
                <div class="hidden md:flex items-center gap-6">
                    <a href="dashboard.html" class="text-gray-600 hover:text-orange-500 transition-colors">
                        Dashboard
                    </a>
                    <a href="projects.html"
                        class="text-orange-500 font-semibold border-b-2 border-orange-500 pb-1 transition-colors">
                        Projects
                    </a>
                    <a href="profile.html" class="text-gray-600 hover:text-orange-500 transition-colors">
                        Profile
                    </a>
                </div>

                <!-- User Info & Logout -->
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-right">
                        <p class="text-sm text-gray-600">Welcome,</p>
                        <p id="userName" class="text-sm font-semibold text-gray-800">Loading...</p>
                    </div>
                    <button id="logoutBtn"
                        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="md:hidden border-t border-gray-200 px-4 py-3 flex gap-4">
            <a href="dashboard.html"
                class="flex-1 text-center text-gray-600 py-2 hover:bg-gray-100 rounded-lg transition-colors">
                Dashboard
            </a>
            <a href="projects.html"
                class="flex-1 text-center text-orange-500 font-semibold py-2 bg-orange-50 rounded-lg">
                Projects
            </a>
            <a href="profile.html"
                class="flex-1 text-center text-gray-600 py-2 hover:bg-gray-100 rounded-lg transition-colors">
                Profile
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h1 class="text-3xl font-bold text-gray-800">📁 MY PROJECTS</h1>
                <button id="newProjectBtn"
                    class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-semibold flex items-center gap-2 transition-all transform hover:scale-105">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    New Project
                </button>
            </div>

            <!-- Filter Tabs -->
            <div class="flex gap-2 border-b border-gray-200">
                <button id="filterAll"
                    class="filter-tab px-6 py-3 font-semibold text-orange-500 border-b-2 border-orange-500 transition-colors"
                    data-filter="all">
                    All
                </button>
                <button id="filterIndividual"
                    class="filter-tab px-6 py-3 font-semibold text-gray-600 hover:text-orange-500 transition-colors"
                    data-filter="individual">
                    Individual
                </button>
                <button id="filterCollaborative"
                    class="filter-tab px-6 py-3 font-semibold text-gray-600 hover:text-orange-500 transition-colors"
                    data-filter="collaborative">
                    Collaborative
                </button>
            </div>
        </div>

        <!-- Active Projects Section -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                🟢 ACTIVE PROJECTS
                <span id="activeCount" class="bg-green-500 text-white text-sm px-3 py-1 rounded-full">0</span>
            </h2>
            <div id="activeProjectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Projects will be inserted here -->
            </div>
        </section>

        <!-- Completed Projects Section -->
        <section>
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                ✅ COMPLETED PROJECTS
                <span id="completedCount" class="bg-blue-600 text-white text-sm px-3 py-1 rounded-full">0</span>
            </h2>
            <div id="completedProjectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Projects will be inserted here -->
            </div>
        </section>
    </main>

    <!-- New Project Modal -->
    <div id="projectModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="modal-backdrop fixed inset-0 bg-black bg-opacity-50" onclick="closeModal()"></div>
        <div class="flex min-h-screen items-center justify-center p-4">
            <div class="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-2xl relative z-10">
                <!-- Modal Header -->
                <div class="border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h3 class="text-2xl font-bold text-gray-800">Create New Project</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Warning if 2 active projects -->
                <div id="projectLimitWarning" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4 mx-6 mt-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i data-lucide="alert-triangle" class="w-5 h-5 text-yellow-400"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-yellow-700">
                                <strong>Warning:</strong> You have 2/2 active projects. Complete or archive one before
                                creating another.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Modal Body -->
                <form id="projectForm" class="px-6 py-6 space-y-6">
                    <!-- Project Name -->
                    <div>
                        <label for="projectName" class="block text-sm font-medium text-gray-700 mb-2">
                            Project Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="projectName" required placeholder="Enter project name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500" />
                    </div>

                    <!-- Project Type -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">
                            Project Type <span class="text-red-500">*</span>
                        </label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="projectType" value="individual" checked
                                    class="w-4 h-4 text-orange-500 focus:ring-orange-500" />
                                <span class="text-gray-700">Individual</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="projectType" value="collaborative"
                                    class="w-4 h-4 text-orange-500 focus:ring-orange-500" />
                                <span class="text-gray-700">Collaborative</span>
                            </label>
                        </div>
                    </div>

                    <!-- Collaborators (shown only for collaborative) -->
                    <div id="collaboratorsSection" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-3">
                            Select Collaborators <span class="text-red-500">*</span>
                        </label>
                        <div id="collaboratorsList" class="space-y-2 bg-gray-50 p-4 rounded-lg">
                            <!-- Collaborator checkboxes will be inserted here -->
                        </div>
                    </div>

                    <!-- End Date -->
                    <div>
                        <label for="endDate" class="block text-sm font-medium text-gray-700 mb-2">
                            End Date <span class="text-red-500">*</span>
                            <span class="text-xs text-gray-500">(1-14 days from today)</span>
                        </label>
                        <input type="date" id="endDate" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500" />
                    </div>
                </form>

                <!-- Modal Footer -->
                <div class="border-t border-gray-200 px-6 py-4 flex justify-end gap-3">
                    <button onclick="closeModal()"
                        class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-semibold">
                        Cancel
                    </button>
                    <button id="createProjectBtn"
                        class="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-lg transition-colors font-semibold flex items-center gap-2">
                        <span>Create Project</span>
                        <svg id="createSpinner" class="hidden animate-spin h-5 w-5 text-white"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        let allProjects = [];
        let currentFilter = 'all';
        let currentUser = null;

        // Authentication Check
        async function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return null;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Invalid token');
                return await response.json();
            } catch (error) {
                console.error('Auth check failed:', error);
                removeToken();
                removeCurrentUser();
                window.location.href = 'login.html';
                return null;
            }
        }

        // Utility Functions
        function getFirstName(email) {
            return email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1);
        }

        function getDaysUntil(dateString) {
            const deadline = new Date(dateString);
            const now = new Date();
            const diffMs = deadline - now;
            const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { text: `${Math.abs(diffDays)} days overdue`, color: 'text-red-600', urgency: 'high' };
            if (diffDays === 0) return { text: 'Due today', color: 'text-yellow-600', urgency: 'medium' };
            if (diffDays === 1) return { text: '1 day left', color: 'text-yellow-600', urgency: 'medium' };
            if (diffDays <= 3) return { text: `${diffDays} days left`, color: 'text-orange-600', urgency: 'medium' };
            if (diffDays <= 7) return { text: `${diffDays} days left`, color: 'text-yellow-600', urgency: 'low' };
            return { text: `${diffDays} days left`, color: 'text-gray-600', urgency: 'low' };
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getAvatarColor(email) {
            const colors = [
                'bg-orange-500', 'bg-blue-500', 'bg-green-500',
                'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-teal-500'
            ];
            let hash = 0;
            for (let i = 0; i < email.length; i++) {
                hash = email.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        // Modal Functions
        function openModal() {
            document.getElementById('projectModal').classList.remove('hidden');
            setupModal();
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('projectModal').classList.add('hidden');
            document.getElementById('projectForm').reset();
            document.getElementById('collaboratorsSection').classList.add('hidden');
        }

        function setupModal() {
            // Set default end date (+7 days)
            const today = new Date();
            const defaultEndDate = new Date(today);
            defaultEndDate.setDate(today.getDate() + 7);

            const minDate = new Date(today);
            minDate.setDate(today.getDate() + 1);

            const maxDate = new Date(today);
            maxDate.setDate(today.getDate() + 14);

            const endDateInput = document.getElementById('endDate');
            endDateInput.value = defaultEndDate.toISOString().split('T')[0];
            endDateInput.min = minDate.toISOString().split('T')[0];
            endDateInput.max = maxDate.toISOString().split('T')[0];

            // Show/hide collaborators based on type
            const typeRadios = document.querySelectorAll('input[name="projectType"]');
            typeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'collaborative') {
                        document.getElementById('collaboratorsSection').classList.remove('hidden');
                        populateCollaborators();
                    } else {
                        document.getElementById('collaboratorsSection').classList.add('hidden');
                    }
                });
            });

            // Check if user has 2 active projects
            const activeProjectsCount = allProjects.filter(p => p.status === 'active').length;
            if (activeProjectsCount >= 2) {
                document.getElementById('projectLimitWarning').classList.remove('hidden');
            } else {
                document.getElementById('projectLimitWarning').classList.add('hidden');
            }
        }

        async function populateCollaborators() {
            const container = document.getElementById('collaboratorsList');
            container.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE_URL}/users`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const users = await response.json();

                // Exclude current user
                const otherUsers = users.filter(email => email !== currentUser.email);

                otherUsers.forEach(email => {
                    const checkbox = document.createElement('label');
                    checkbox.className = 'flex items-center gap-3 cursor-pointer hover:bg-gray-100 p-2 rounded transition-colors';
                    checkbox.innerHTML = `
                        <input 
                            type="checkbox" 
                            name="collaborator" 
                            value="${email}"
                            class="w-4 h-4 text-orange-500 rounded focus:ring-orange-500"
                        />
                        <div class="${getAvatarColor(email)} w-8 h-8 rounded-full flex items-center justify-center text-white font-semibold text-sm">
                            ${getFirstName(email).charAt(0)}
                        </div>
                        <span class="text-gray-700">${email}</span>
                    `;
                    container.appendChild(checkbox);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Fetch Projects
        async function fetchProjects() {
            try {
                const response = await fetch(`${API_BASE_URL}/projects`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });

                if (!response.ok) throw new Error('Failed to fetch projects');
                allProjects = await response.json();
                renderProjects();
            } catch (error) {
                console.error('Error fetching projects:', error);
                showToast('Error loading projects', 'error');
            }
        }

        // Render Projects
        function renderProjects() {
            const activeGrid = document.getElementById('activeProjectsGrid');
            const completedGrid = document.getElementById('completedProjectsGrid');

            // Filter projects based on current filter
            let filteredProjects = allProjects;
            if (currentFilter === 'individual') {
                filteredProjects = allProjects.filter(p => !p.is_collaborative);
            } else if (currentFilter === 'collaborative') {
                filteredProjects = allProjects.filter(p => p.is_collaborative);
            }

            const activeProjects = filteredProjects.filter(p => p.status === 'active');
            const completedProjects = filteredProjects.filter(p => p.status === 'done');

            // Update counts
            document.getElementById('activeCount').textContent = activeProjects.length;
            document.getElementById('completedCount').textContent = completedProjects.length;

            // Render active projects
            if (activeProjects.length === 0) {
                activeGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400">
                        <i data-lucide="folder-open" class="w-16 h-16 mx-auto mb-4"></i>
                        <p class="text-lg">No active projects yet. Create your first project!</p>
                    </div>
                `;
            } else {
                activeGrid.innerHTML = activeProjects.map(project => createProjectCard(project, 'active')).join('');
            }

            // Render completed projects
            if (completedProjects.length === 0) {
                completedGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400">
                        <i data-lucide="check-circle" class="w-16 h-16 mx-auto mb-4"></i>
                        <p class="text-lg">No completed projects yet. Keep going!</p>
                    </div>
                `;
            } else {
                completedGrid.innerHTML = completedProjects.map(project => createProjectCard(project, 'completed')).join('');
            }

            lucide.createIcons();
        }

        // Create Project Card HTML
        function createProjectCard(project, type) {
            const isCreator = project.created_by === currentUser.email;
            const typeBadgeColor = project.is_collaborative ? 'bg-purple-100 text-purple-600' : 'bg-blue-100 text-blue-600';
            const typeBadgeText = project.is_collaborative ? 'Collaborative' : 'Individual';

            const progress = project.total_tasks > 0 ? (project.completed_tasks / project.total_tasks) * 100 : 0;

            let deadlineInfo = '';
            if (type === 'active' && project.end_date) {
                const deadline = getDaysUntil(project.end_date);
                const urgencyClass = deadline.urgency === 'high' ? 'bg-red-50 border-red-200 text-red-700' :
                    deadline.urgency === 'medium' ? 'bg-yellow-50 border-yellow-200 text-yellow-700' :
                        'bg-gray-50 border-gray-200 text-gray-700';
                deadlineInfo = `
                    <div class="${urgencyClass} border rounded-lg p-3 mb-4">
                        <p class="text-sm font-medium">Ends ${formatDate(project.end_date)} • ${deadline.text}</p>
                    </div>
                `;
            }

            // Collaborator avatars
            const collaboratorAvatars = project.members.slice(0, 3).map(member => `
                <div class="${getAvatarColor(member.email)} w-8 h-8 rounded-full flex items-center justify-center text-white font-semibold text-xs border-2 border-white -ml-2">
                    ${getFirstName(member.email).charAt(0)}
                </div>
            `).join('');

            const moreCount = project.members.length > 3 ? `
                <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center text-gray-700 text-xs font-semibold border-2 border-white -ml-2">
                    +${project.members.length - 3}
                </div>
            ` : '';

            return `
                <div class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all p-6 ${type === 'completed' ? 'opacity-75' : ''}">
                    <!-- Header -->
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-gray-800 mb-2">${project.name}</h3>
                            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${typeBadgeColor}">
                                ${typeBadgeText}
                            </span>
                        </div>
                    </div>

                    <!-- Collaborators -->
                    <div class="flex items-center mb-4 ml-2">
                        ${collaboratorAvatars}
                        ${moreCount}
                    </div>

                    <!-- Progress -->
                    <div class="mb-4">
                        <div class="flex justify-between text-sm text-gray-600 mb-2">
                            <span>${project.completed_tasks}/${project.total_tasks} tasks</span>
                            <span>${Math.round(progress)}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-orange-500 h-2 rounded-full transition-all" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    ${deadlineInfo}

                    <!-- Actions -->
                    <div class="flex gap-2">
                        <button 
                            onclick="window.location.href='tasks.html?project_id=${project.id}'"
                            class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 px-4 rounded-lg font-semibold transition-colors"
                        >
                            ${type === 'active' ? 'View Tasks' : 'View Details'}
                        </button>
                        ${type === 'active' ? `
                            <button 
                                onclick="markProjectDone(${project.id}, ${isCreator})"
                                class="${isCreator ? 'bg-green-50 hover:bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400 cursor-not-allowed'} py-2 px-4 rounded-lg font-semibold transition-colors"
                                ${!isCreator ? 'disabled title="Only creator can mark as done"' : ''}
                            >
                                <i data-lucide="check" class="w-5 h-5"></i>
                            </button>
                        ` : `
                            <button 
                                onclick="archiveProject(${project.id})"
                                class="bg-gray-50 hover:bg-gray-100 text-gray-600 py-2 px-4 rounded-lg font-semibold transition-colors"
                            >
                                <i data-lucide="archive" class="w-5 h-5"></i>
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        // Create Project
        async function createProject() {
            const name = document.getElementById('projectName').value.trim();
            const type = document.querySelector('input[name="projectType"]:checked').value;
            const endDate = document.getElementById('endDate').value;

            // Validation
            if (!name) {
                showToast('Please enter a project name', 'error');
                return;
            }

            // Check date is within 1-14 days
            const today = new Date();
            const selectedDate = new Date(endDate);
            const diffDays = Math.ceil((selectedDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 1 || diffDays > 14) {
                showToast('End date must be 1-14 days from today', 'error');
                return;
            }

            // Get collaborators if collaborative
            let collaborators = [];
            if (type === 'collaborative') {
                const checkboxes = document.querySelectorAll('input[name="collaborator"]:checked');
                collaborators = Array.from(checkboxes).map(cb => cb.value);

                if (collaborators.length === 0) {
                    showToast('Please select at least one collaborator', 'error');
                    return;
                }
            }

            // Show loading
            const btn = document.getElementById('createProjectBtn');
            const spinner = document.getElementById('createSpinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/projects`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        members: collaborators,
                        start_date: new Date().toISOString(),
                        end_date: new Date(endDate).toISOString()
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Project created successfully!', 'success');
                    closeModal();
                    await fetchProjects();
                } else {
                    throw new Error(data.detail || 'Failed to create project');
                }
            } catch (error) {
                console.error('Error creating project:', error);
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        // Mark Project as Done
        async function markProjectDone(projectId, isCreator) {
            if (!isCreator) {
                showToast('Only the project creator can mark it as done', 'warning');
                return;
            }

            if (!confirm('Mark this project as done?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/projects/${projectId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'done' })
                });

                if (response.ok) {
                    showToast('Project marked as done!', 'success');
                    await fetchProjects();
                } else {
                    throw new Error('Failed to update project');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error updating project', 'error');
            }
        }

        // Archive Project
        async function archiveProject(projectId) {
            if (!confirm('Archive this project?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/projects/${projectId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'archived' })
                });

                if (response.ok) {
                    showToast('Project archived!', 'success');
                    await fetchProjects();
                } else {
                    throw new Error('Failed to archive project');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error archiving project', 'error');
            }
        }

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                // Update active state
                document.querySelectorAll('.filter-tab').forEach(t => {
                    t.classList.remove('text-orange-500', 'border-b-2', 'border-orange-500');
                    t.classList.add('text-gray-600');
                });
                e.target.classList.remove('text-gray-600');
                e.target.classList.add('text-orange-500', 'border-b-2', 'border-orange-500');

                // Update filter
                currentFilter = e.target.dataset.filter;
                renderProjects();
            });
        });

        // Event Listeners
        document.getElementById('newProjectBtn').addEventListener('click', openModal);
        document.getElementById('createProjectBtn').addEventListener('click', createProject);
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) logout();
        });

        // Check for action parameter
        window.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (!currentUser) return;

            document.getElementById('userName').textContent = getFirstName(currentUser.email);

            await fetchProjects();
            lucide.createIcons();

            // Check if should open modal
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'new') {
                openModal();
            }
        });
    </script>
</body>

</html>
