services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutmeg_user
      POSTGRES_PASSWORD: nutmeg_secret
      POSTGRES_DB: nutmeg_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutmeg_user -d nutmeg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_TYPE: postgresql
      POSTGRES_USER: nutmeg_user
      POSTGRES_PASSWORD: nutmeg_secret
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nutmeg_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
